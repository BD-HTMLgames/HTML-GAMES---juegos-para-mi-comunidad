<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en Raya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        /* Fondo decorativo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Partículas flotantes */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: clamp(15px, 4vw, 30px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            max-width: min(500px, 90vw);
            width: 100%;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: clamp(15px, 3vw, 25px);
            font-size: clamp(1.5em, 5vw, 2em);
            font-weight: bold;
        }

        /* Controles del juego */
        .controls {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 2vw, 15px);
            margin-bottom: clamp(15px, 3vw, 25px);
        }

        .mode-selector {
            display: flex;
            gap: clamp(8px, 2vw, 10px);
            justify-content: center;
        }

        .mode-btn {
            flex: 1;
            padding: clamp(10px, 2.5vw, 12px) clamp(15px, 3vw, 20px);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: clamp(0.85em, 2.5vw, 1em);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .mode-btn:hover::before {
            left: 100%;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #764ba2, #667eea);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }

        .difficulty-selector {
            display: none;
            gap: clamp(8px, 2vw, 10px);
            justify-content: center;
            padding: clamp(10px, 2vw, 15px);
            background: rgba(102, 126, 234, 0.1);
            border-radius: 12px;
            animation: slideDown 0.3s ease;
        }

        .difficulty-selector.show {
            display: flex;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .diff-btn {
            padding: clamp(6px, 2vw, 8px) clamp(12px, 3vw, 16px);
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(0.8em, 2.5vw, 0.9em);
            font-weight: 600;
        }

        .diff-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .diff-btn.active {
            background: #667eea;
            color: white;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        /* Estado del juego */
        .status {
            text-align: center;
            font-size: clamp(1em, 3vw, 1.2em);
            color: #333;
            margin-bottom: clamp(15px, 3vw, 20px);
            min-height: clamp(25px, 5vw, 30px);
            font-weight: bold;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .status.winner {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Tablero de juego */
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(8px, 2vw, 10px);
            margin: 0 auto clamp(15px, 3vw, 20px);
            max-width: min(350px, 80vw);
            aspect-ratio: 1;
        }

        .cell {
            background: linear-gradient(145deg, #f0f4f8, #d9e2ec);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2em, 6vw, 3em);
            font-weight: bold;
            transition: all 0.3s ease;
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .cell::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.3), transparent);
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        .cell:hover:not(.taken)::before {
            width: 100%;
            height: 100%;
        }

        .cell:hover:not(.taken) {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            background: linear-gradient(145deg, #e6ecf1, #c8d4e0);
        }

        .cell.taken {
            cursor: not-allowed;
            animation: placeMarker 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .cell.x {
            color: #667eea;
            text-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        }

        .cell.o {
            color: #764ba2;
            text-shadow: 0 2px 4px rgba(118, 75, 162, 0.3);
        }

        .cell.winner {
            background: linear-gradient(145deg, #fff3cd, #ffe69c);
            animation: winPulse 1s infinite;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
        }

        @keyframes placeMarker {
            0% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(90deg);
                opacity: 0.8;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes winPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 30px rgba(255, 193, 7, 0.8);
            }
        }

        /* Botón de reinicio */
        .reset-btn {
            display: block;
            margin: 0 auto;
            padding: clamp(12px, 3vw, 15px) clamp(25px, 5vw, 30px);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: clamp(0.95em, 3vw, 1.1em);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .reset-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .reset-btn:hover::after {
            width: 300px;
            height: 300px;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        /* Responsive extra pequeño */
        @media (max-height: 600px) {
            .game-container {
                padding: 10px;
            }
            
            h1 {
                margin-bottom: 10px;
            }
            
            .controls {
                margin-bottom: 10px;
                gap: 8px;
            }
            
            .status {
                margin-bottom: 10px;
                padding: 5px;
            }
            
            .game-board {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <div class="game-container">
        <h1>🎮 TRES EN RAYA</h1>
        
        <!-- Controles -->
        <div class="controls">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setGameMode('pvp')">👥 2 Jugadores</button>
                <button class="mode-btn" onclick="setGameMode('ai')">🤖 vs Máquina</button>
            </div>
            
            <div class="difficulty-selector" id="difficultySelector">
                <button class="diff-btn active" onclick="setDifficulty('easy')">Fácil</button>
                <button class="diff-btn" onclick="setDifficulty('medium')">Medio</button>
                <button class="diff-btn" onclick="setDifficulty('hard')">Difícil</button>
            </div>
        </div>

        <!-- Estado del juego -->
        <div class="status" id="status">Turno de: X</div>

        <!-- Tablero -->
        <div class="game-board" id="gameBoard">
            <div class="cell" data-index="0" onclick="makeMove(0)"></div>
            <div class="cell" data-index="1" onclick="makeMove(1)"></div>
            <div class="cell" data-index="2" onclick="makeMove(2)"></div>
            <div class="cell" data-index="3" onclick="makeMove(3)"></div>
            <div class="cell" data-index="4" onclick="makeMove(4)"></div>
            <div class="cell" data-index="5" onclick="makeMove(5)"></div>
            <div class="cell" data-index="6" onclick="makeMove(6)"></div>
            <div class="cell" data-index="7" onclick="makeMove(7)"></div>
            <div class="cell" data-index="8" onclick="makeMove(8)"></div>
        </div>

        <!-- Botón reiniciar -->
        <button class="reset-btn" onclick="resetGame()">🔄 Nueva Partida</button>
    </div>

    <script>
        // Estado del juego
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'pvp';
        let difficulty = 'easy';

        // Combinaciones ganadoras
        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        // Crear partículas de fondo
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Realizar movimiento
        function makeMove(index) {
            if (!gameActive || board[index] !== '') return;

            board[index] = currentPlayer;
            updateCell(index);

            if (checkWinner()) {
                endGame(false);
                return;
            }

            if (checkTie()) {
                endGame(true);
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();

            if (gameMode === 'ai' && currentPlayer === 'O' && gameActive) {
                setTimeout(() => makeAIMove(), 600);
            }
        }

        // Actualizar celda
        function updateCell(index) {
            const cell = document.querySelector(`[data-index="${index}"]`);
            cell.textContent = board[index];
            cell.classList.add('taken', board[index].toLowerCase());
        }

        // Verificar ganador
        function checkWinner() {
            for (let combination of winningCombinations) {
                const [a, b, c] = combination;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    highlightWinningCells(combination);
                    return true;
                }
            }
            return false;
        }

        // Resaltar celdas ganadoras
        function highlightWinningCells(combination) {
            combination.forEach(index => {
                document.querySelector(`[data-index="${index}"]`).classList.add('winner');
            });
        }

        // Verificar empate
        function checkTie() {
            return board.every(cell => cell !== '');
        }

        // Movimiento de la IA
        function makeAIMove() {
            if (!gameActive) return;

            let move;
            if (difficulty === 'easy') {
                move = getRandomMove();
            } else if (difficulty === 'medium') {
                move = Math.random() < 0.5 ? getBestMove() : getRandomMove();
            } else {
                move = getBestMove();
            }

            if (move !== -1) {
                makeMove(move);
            }
        }

        // Movimiento aleatorio
        function getRandomMove() {
            const availableMoves = [];
            board.forEach((cell, index) => {
                if (cell === '') availableMoves.push(index);
            });
            return availableMoves.length > 0 
                ? availableMoves[Math.floor(Math.random() * availableMoves.length)]
                : -1;
        }

        // Mejor movimiento (Minimax)
        function getBestMove() {
            let bestScore = -Infinity;
            let bestMove = -1;

            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        // Algoritmo Minimax
        function minimax(board, depth, isMaximizing) {
            if (checkWinnerForMinimax('O')) return 10 - depth;
            if (checkWinnerForMinimax('X')) return depth - 10;
            if (checkTieForMinimax()) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        let score = minimax(board, depth + 1, false);
                        board[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        let score = minimax(board, depth + 1, true);
                        board[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        // Funciones auxiliares para Minimax
        function checkWinnerForMinimax(player) {
            for (let combination of winningCombinations) {
                const [a, b, c] = combination;
                if (board[a] === player && board[b] === player && board[c] === player) {
                    return true;
                }
            }
            return false;
        }

        function checkTieForMinimax() {
            return board.every(cell => cell !== '');
        }

        // Finalizar juego
        function endGame(isTie) {
            gameActive = false;
            const statusElement = document.getElementById('status');
            
            if (isTie) {
                statusElement.textContent = '¡Empate! 🤝';
            } else {
                statusElement.textContent = `¡${currentPlayer} Gana! 🎉`;
                statusElement.classList.add('winner');
            }
        }

        // Actualizar estado
        function updateStatus(message = null) {
            const statusElement = document.getElementById('status');
            statusElement.classList.remove('winner');
            
            if (message) {
                statusElement.textContent = message;
            } else {
                if (gameMode === 'ai' && currentPlayer === 'O') {
                    statusElement.textContent = 'Turno de la máquina...';
                } else {
                    statusElement.textContent = `Turno de: ${currentPlayer}`;
                }
            }
        }

        // Reiniciar juego
        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });
            
            updateStatus();
        }

        // Cambiar modo de juego
        function setGameMode(mode) {
            gameMode = mode;
            resetGame();
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            const diffSelector = document.getElementById('difficultySelector');
            if (mode === 'ai') {
                diffSelector.classList.add('show');
            } else {
                diffSelector.classList.remove('show');
            }
        }

        // Cambiar dificultad
        function setDifficulty(level) {
            difficulty = level;
            resetGame();
            
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Inicializar
        createParticles();
        updateStatus();
    </script>
</body>
</html>
