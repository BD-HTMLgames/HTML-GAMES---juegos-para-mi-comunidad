<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Voxel 3D</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    background-color: #87CEEB;
    user-select: none;
}

canvas {
    image-rendering: pixelated;
}

#game-container { width: 100vw; height: 100vh; }

#crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); color: white;
    font-size: 24px; font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
    pointer-events: none;
}

#hud-info {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0, 0, 0, 0.5);
    padding: 10px; border-radius: 5px;
    color: white; font-size: 14px;
    text-align: right; pointer-events: none;
}

#block-name { font-weight: bold; color: #4ff; margin-bottom: 5px; }

#hotbar {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%); display: flex; gap: 4px;
    background: rgba(0, 0, 0, 0.4); padding: 4px; border-radius: 4px;
}

.hotbar-slot {
    width: 50px; height: 50px;
    background: rgba(50, 50, 50, 0.8);
    border: 2px solid #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: border-color 0.1s;
}

.hotbar-slot.active { border-color: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }

.block-preview {
    width: 36px; height: 36px; border-radius: 4px;
    box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5);
}

.slot-number {
    position: absolute; bottom: 2px; right: 4px;
    color: #aaa; font-size: 12px; font-weight: bold;
}
</style>
</head>
<body>

    <div id="game-container"></div>
    <div id="crosshair">+</div>

    <!-- HUD de información -->
    <div id="hud-info">
        <div id="block-name">Mirando: Aire</div>
        <div id="coords">X: 0 Y: 0 Z: 0</div>
    </div>

    <!-- Hotbar de 9 slots -->
    <div id="hotbar">
        <div class="hotbar-slot active" id="slot-1"><div class="block-preview" style="background-color:#5d9c3f;"></div><span class="slot-number">1</span></div>
        <div class="hotbar-slot" id="slot-2"><div class="block-preview" style="background-color:#8a5a32;"></div><span class="slot-number">2</span></div>
        <div class="hotbar-slot" id="slot-3"><div class="block-preview" style="background-color:#8f8f8f;"></div><span class="slot-number">3</span></div>
        <div class="hotbar-slot" id="slot-4"><div class="block-preview" style="background-color:#6b511f;"></div><span class="slot-number">4</span></div>
        <div class="hotbar-slot" id="slot-5"><div class="block-preview" style="background-color:#3e7a24;"></div><span class="slot-number">5</span></div>
        <div class="hotbar-slot" id="slot-6"><div class="block-preview" style="background-color:#72241f;"></div><span class="slot-number">6</span></div>
        <div class="hotbar-slot" id="slot-7"><div class="block-preview" style="background-color:#f5d93d;"></div><span class="slot-number">7</span></div>
        <div class="hotbar-slot" id="slot-8"><div class="block-preview" style="background-color:#d8d8d8;"></div><span class="slot-number">8</span></div>
        <div class="hotbar-slot" id="slot-9"><div class="block-preview" style="background-color:#1b1029;"></div><span class="slot-number">9</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// SIMULADOR VOXEL 3D - Versión completa restaurada
// ============================================================

// --- CONFIGURACIÓN INICIAL ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game-container').appendChild(renderer.domElement);

scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(50, 100, 50);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -80;
dirLight.shadow.camera.right = 80;
dirLight.shadow.camera.top = 80;
dirLight.shadow.camera.bottom = -80;
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 300;
dirLight.shadow.bias = -0.0005;
scene.add(dirLight);

// --- VARIABLES GLOBALES ---
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
const velocity = new THREE.Vector3();
const raycaster = new THREE.Raycaster();
const dynamicBlocks = [];   // Bloques individuales (árboles y los que colocas)
const particles = [];       // Partículas de polvo
const clouds = [];          // Nubes
let selectedBlockType = 'grass';
let playerObj = null;       // Referencia al cuerpo del jugador
let tm = null;              // TextureManager global

const elBlockName = document.getElementById('block-name');
const elCoords = document.getElementById('coords');

const boxGeo = new THREE.BoxGeometry(1, 1, 1); // Geometría compartida (NUNCA se dispose)
const dummy = new THREE.Object3D();

// --- NOMBRES Y COLORES ---
const NAMES = { grass:'Hierba', dirt:'Tierra', stone:'Piedra', wood:'Madera', leaves:'Hojas', red:'Netherrack', gold:'Oro', silver:'Hierro', obsidian:'Obsidiana' };
const PARTICLE_COLORS = { grass:0x5d9c3f, dirt:0x8a5a32, stone:0x8f8f8f, wood:0x6b511f, leaves:0x3e7a24, red:0x72241f, gold:0xf5d93d, silver:0xd8d8d8, obsidian:0x1b1029 };

// ============================================================
// 1. TUS TEXTURAS (Edita las URLs aquí, no necesita JSON externo)
// ============================================================
const TEXTURE_CONFIG = {
    grass:    { top: "https://minecraft.wiki/images/Grass_Block_Top.png", bottom: "https://minecraft.wiki/images/Dirt.png", side: "https://minecraft.wiki/images/Grass_Block_Side.png" },
    dirt:     { side: "https://minecraft.wiki/images/Dirt.png" },
    stone:    { side: "https://minecraft.wiki/images/Stone.png" },
    wood:     { top: "https://minecraft.wiki/images/Oak_Log_Top.png", bottom: "https://minecraft.wiki/images/Oak_Log_Top.png", side: "https://minecraft.wiki/images/Oak_Log.png" },
    leaves:   { side: "https://minecraft.wiki/images/Oak_Leaves.png" },
    red:      { side: "https://minecraft.wiki/images/Netherrack.png" },
    gold:     { side: "https://minecraft.wiki/images/Gold_Block.png" },
    silver:   { side: "https://minecraft.wiki/images/Iron_Block.png" },
    obsidian: { side: "https://minecraft.wiki/images/Obsidian.png" },
    cloud:    { side: "https://minecraft.wiki/images/Cloud.png" }
};

// Teclas 1-9 para la hotbar
const blockKeys = {
    'Digit1':'grass', 'Digit2':'dirt', 'Digit3':'stone', 'Digit4':'wood', 'Digit5':'leaves',
    'Digit6':'red', 'Digit7':'gold', 'Digit8':'silver', 'Digit9':'obsidian'
};

// ============================================================
// 2. MUNDO VOXEL (mapa mental de bloques + colisión matemática)
// ============================================================
const solidVoxels = new Set();   // Guarda "x,y,z" de cada bloque sólido del mundo
const staticMeshes = {};         // Por tipo: { mesh, keys[] } para poder borrar instancias
const keyOf = (x, y, z) => x + ',' + y + ',' + z;

// Colisión: revisa si la caja del jugador (0.6 ancho x 1.8 alto) toca algún voxel sólido
function boxCollides(px, py, pz) {
    const r = 0.3, h = 0.9; // mitad de ancho y mitad de alto
    const xMin = Math.floor(px - r - 0.5) + 1, xMax = Math.ceil(px + r + 0.5) - 1;
    const yMin = Math.floor(py - h - 0.5) + 1, yMax = Math.ceil(py + h + 0.5) - 1;
    const zMin = Math.floor(pz - r - 0.5) + 1, zMax = Math.ceil(pz + r + 0.5) - 1;
    for (let x = xMin; x <= xMax; x++)
        for (let y = yMin; y <= yMax; y++)
            for (let z = zMin; z <= zMax; z++)
                if (solidVoxels.has(keyOf(x, y, z))) return true;
    return false;
}

// ============================================================
// 3. GENERADOR DE NUBES
// ============================================================
function generateClouds() {
    if (!tm) return;
    const cloudGeo = new THREE.PlaneGeometry(15, 15);
    const cloudTex = tm.cache[TEXTURE_CONFIG.cloud.side] || tm.defaultTexture;
    const cloudMat = new THREE.MeshLambertMaterial({ map: cloudTex, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
    if (!cloudMat.map) cloudMat.color.setHex(0xffffff);

    for (let i = 0; i < 30; i++) {
        const cloud = new THREE.Mesh(cloudGeo, cloudMat);
        cloud.position.set((Math.random() - 0.5) * 200, 60 + Math.random() * 20, (Math.random() - 0.5) * 200);
        cloud.rotation.x = -Math.PI / 2;
        cloud.scale.set(1 + Math.random(), 1 + Math.random(), 1 + Math.random());
        cloud.userData = { speed: 0.02 + Math.random() * 0.05, limit: 120 };
        scene.add(cloud);
        clouds.push(cloud);
    }
}

// ============================================================
// 4. PARTÍCULAS DE POLVO (al romper bloques)
// ============================================================
function spawnParticles(pos, color) {
    const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const mat = new THREE.MeshBasicMaterial({ color: color });
    for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(pos);
        p.position.x += (Math.random() - 0.5) * 0.8;
        p.position.y += (Math.random() - 0.5) * 0.8;
        p.position.z += (Math.random() - 0.5) * 0.8;
        p.userData = {
            velocity: new THREE.Vector3((Math.random() - 0.5) * 0.1, Math.random() * 0.2, (Math.random() - 0.5) * 0.1),
            life: 30 + Math.random() * 10
        };
        scene.add(p);
        particles.push(p);
    }
}

// ============================================================
// 5. SISTEMA DE TEXTURAS
// ============================================================
class TextureManager {
    constructor() {
        this.cache = {};      // url -> textura
        this.matCache = {};   // tipo -> 6 materiales
        this.defaultTexture = this.createFallbackColor(0xffffff);
    }

    async init() {
        for (const type in TEXTURE_CONFIG) {
            const c = TEXTURE_CONFIG[type];
            if (c.side)   this.cache[c.side]   = await this.loadImg(c.side);
            if (c.top)    this.cache[c.top]    = await this.loadImg(c.top);
            if (c.bottom) this.cache[c.bottom] = await this.loadImg(c.bottom);
        }
        this.matCache = {}; // Limpiar materiales creados antes de tener las texturas
        return TEXTURE_CONFIG;
    }

    loadImg(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                const t = new THREE.Texture(img);
                t.magFilter = THREE.NearestFilter;  // Píxeles duros estilo Minecraft
                t.minFilter = THREE.NearestFilter;
                t.needsUpdate = true;
                resolve(t);
            };
            img.onerror = () => resolve(this.defaultTexture);
            img.src = url;
        });
    }

    createFallbackColor(color) {
        const c = document.createElement('canvas'); c.width = 16; c.height = 16;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
        ctx.fillRect(0, 0, 16, 16);
        const t = new THREE.CanvasTexture(c);
        t.magFilter = THREE.NearestFilter;
        return t;
    }

    getMat(url) {
        return new THREE.MeshLambertMaterial({ map: this.cache[url] || this.defaultTexture });
    }

    // Devuelve los 6 materiales: [+X, -X, Arriba, Abajo, +Z, -Z]
    // Si falta "top" o "bottom", usa "side" automáticamente
    getBlockMats(type) {
        if (this.matCache[type]) return this.matCache[type];
        const c = TEXTURE_CONFIG[type];
        let mats;
        if (!c) {
            const m = new THREE.MeshLambertMaterial({ map: this.defaultTexture });
            mats = [m, m, m, m, m, m];
        } else {
            const s = this.getMat(c.side);
            const t = this.getMat(c.top || c.side);
            const b = this.getMat(c.bottom || c.side);
            mats = [s, s, t, b, s, s];
        }
        this.matCache[type] = mats;
        return mats;
    }
}

// ============================================================
// 6. MANO EN PRIMERA PERSONA
// ============================================================
const handGroup = new THREE.Group();
camera.add(handGroup);
handGroup.position.set(0.7, -0.6, -0.8);
let blockInHand = null;

function updateHandModel(type) {
    if (!tm) return;
    if (blockInHand) handGroup.remove(blockInHand); // La geometría/materiales son compartidos, no se destruyen
    blockInHand = new THREE.Mesh(boxGeo, tm.getBlockMats(type));
    blockInHand.scale.set(0.3, 0.3, 0.3);
    handGroup.add(blockInHand);
}

// ============================================================
// 7. CONSTRUCCIÓN DEL MUNDO
// ============================================================
function addDynamicBlock(x, y, z, type, name) {
    const key = keyOf(x, y, z);
    if (solidVoxels.has(key)) return null; // Evita bloques duplicados en la misma celda
    const m = new THREE.Mesh(boxGeo, tm.getBlockMats(type));
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    m.userData = { isBlock: true, isDynamic: true, blockType: type, name: name };
    scene.add(m);
    dynamicBlocks.push(m);
    solidVoxels.add(key);
    return m;
}

function buildWorld() {
    const size = 50;        // De -50 a +50 = 100x100 de largo
    const SURFACE = 0;      // La capa de hierba queda en y=0
    const dirtLayers = 3;   // Tierra: y = -1, -2, -3
    const stoneLayers = 5;  // Piedra: y = -4 ... -8
    const bottomY = SURFACE - dirtLayers - stoneLayers;

    const positions = { grass: [], dirt: [], stone: [] };

    for (let x = -size; x < size; x++) {
        for (let z = -size; z < size; z++) {
            positions.grass.push([x, SURFACE, z]);
            for (let y = SURFACE - dirtLayers; y < SURFACE; y++) positions.dirt.push([x, y, z]);
            for (let y = bottomY; y < SURFACE - dirtLayers; y++) positions.stone.push([x, y, z]);
        }
    }

    // Crear las InstancedMesh (una por tipo, ultra optimizado)
    for (const type of ['grass', 'dirt', 'stone']) {
        const list = positions[type];
        const mesh = new THREE.InstancedMesh(boxGeo, tm.getBlockMats(type), list.length);
        mesh.receiveShadow = true;
        mesh.userData = { isBlock: true, isStatic: true, type: type };
        const keys = [];
        list.forEach(([x, y, z], i) => {
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);
            const k = keyOf(x, y, z);
            keys.push(k);
            solidVoxels.add(k);
        });
        mesh.instanceMatrix.needsUpdate = true;
        scene.add(mesh);
        staticMeshes[type] = { mesh, keys };
    }

    // --- ÁRBOLES (sobre la superficie, sin bloques encimados) ---
    const treeCoords = [
        [20,20], [-20,20], [20,-20], [-20,-20],
        [0,40], [0,-40], [40,0], [-40,0],
        [30,30], [-30,-30]
    ];

    treeCoords.forEach(([tx, tz]) => {
        const base = SURFACE + 1; // El tronco empieza justo encima de la hierba
        // Tronco: 4 bloques (base, base+1, base+2, base+3)
        for (let y = 0; y < 4; y++) addDynamicBlock(tx, base + y, tz, 'wood', NAMES.wood);
        // Copa capa 1 (al nivel del tope del tronco): anillo alrededor
        for (let x = -1; x <= 1; x++)
            for (let z = -1; z <= 1; z++)
                if (!(x === 0 && z === 0)) addDynamicBlock(tx + x, base + 3, tz + z, 'leaves', NAMES.leaves);
        // Copa capa 2: 3x3 completa
        for (let x = -1; x <= 1; x++)
            for (let z = -1; z <= 1; z++)
                addDynamicBlock(tx + x, base + 4, tz + z, 'leaves', NAMES.leaves);
        // Copa capa 3 (tope): forma de cruz
        addDynamicBlock(tx, base + 5, tz, 'leaves', NAMES.leaves);
        addDynamicBlock(tx + 1, base + 5, tz, 'leaves', NAMES.leaves);
        addDynamicBlock(tx - 1, base + 5, tz, 'leaves', NAMES.leaves);
        addDynamicBlock(tx, base + 5, tz + 1, 'leaves', NAMES.leaves);
        addDynamicBlock(tx, base + 5, tz - 1, 'leaves', NAMES.leaves);
    });
}

// ============================================================
// 8. JUGADOR, CONTROLES Y BUCLE PRINCIPAL
// ============================================================
function startPlayerLoop() {
    const player = new THREE.Object3D();
    camera.rotation.order = 'YXZ';
    player.add(camera);
    // ALTURA DE LOS OJOS (ajústala aquí si quieres, no afecta la hitbox)
    camera.position.set(0, 1.2, 0);
    scene.add(player);
    player.position.set(0, 10, 0);
    playerObj = player;

    // --- TECLADO ---
    document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveForward = true;
        if (e.code === 'KeyS') moveBackward = true;
        if (e.code === 'KeyA') moveLeft = true;
        if (e.code === 'KeyD') moveRight = true;
        // Salto de 1 bloque: solo si toca el suelo (no se puede hacer spam)
        if (e.code === 'Space' && canJump) {
            velocity.y = 8;
            canJump = false;
        }
        if (blockKeys[e.code]) {
            selectedBlockType = blockKeys[e.code];
            updateHandModel(selectedBlockType);
            updateHotbarUI(e.code.replace('Digit', ''));
        }
    });

    document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') moveForward = false;
        if (e.code === 'KeyS') moveBackward = false;
        if (e.code === 'KeyA') moveLeft = false;
        if (e.code === 'KeyD') moveRight = false;
    });

    // --- RATÓN ---
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === renderer.domElement) {
            player.rotation.y -= (e.movementX || 0) * 0.002;
            camera.rotation.x -= (e.movementY || 0) * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        }
    });

    renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
    document.addEventListener('contextmenu', e => e.preventDefault());

    // --- CLICKS: PICAR Y PONER ---
    document.addEventListener('mousedown', (e) => {
        if (document.pointerLockElement !== renderer.domElement) return;
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

        const staticList = Object.values(staticMeshes).map(s => s.mesh);
        const targets = [...dynamicBlocks, ...staticList];
        const hits = raycaster.intersectObjects(targets, false);

        if (hits.length > 0 && hits[0].distance < 8) {
            handGroup.rotation.x = -0.5;
            setTimeout(() => handGroup.rotation.x = 0, 100);

            const hit = hits[0];
            const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
            n.set(Math.round(n.x), Math.round(n.y), Math.round(n.z));

            if (e.button === 0) {
                // ================= ROMPER =================
                if (hit.object.userData.isStatic) {
                    const type = hit.object.userData.type;
                    const sm = staticMeshes[type];
                    const idx = hit.instanceId;
                    if (idx === undefined || idx >= sm.mesh.count) return;

                    const key = sm.keys[idx];
                    // Truco O(1): mover la última instancia al hueco y reducir el contador
                    const last = sm.mesh.count - 1;
                    if (idx !== last) {
                        const m4 = new THREE.Matrix4();
                        sm.mesh.getMatrixAt(last, m4);
                        sm.mesh.setMatrixAt(idx, m4);
                        sm.keys[idx] = sm.keys[last];
                    }
                    sm.mesh.count = last;
                    sm.keys.pop();
                    sm.mesh.instanceMatrix.needsUpdate = true;
                    solidVoxels.delete(key);

                    const p = hit.point.clone().addScaledVector(n, -0.5);
                    spawnParticles(new THREE.Vector3(Math.round(p.x), Math.round(p.y), Math.round(p.z)), PARTICLE_COLORS[type] || 0xffffff);

                } else if (hit.object.userData.isDynamic) {
                    const obj = hit.object;
                    const key = keyOf(Math.round(obj.position.x), Math.round(obj.position.y), Math.round(obj.position.z));
                    solidVoxels.delete(key);
                    scene.remove(obj);
                    const i = dynamicBlocks.indexOf(obj);
                    if (i > -1) dynamicBlocks.splice(i, 1);
                    spawnParticles(obj.position.clone(), PARTICLE_COLORS[obj.userData.blockType] || 0xffffff);
                }

            } else if (e.button === 2) {
                // ================= PONER =================
                const vx = Math.round(hit.point.x + n.x * 0.5);
                const vy = Math.round(hit.point.y + n.y * 0.5);
                const vz = Math.round(hit.point.z + n.z * 0.5);
                const key = keyOf(vx, vy, vz);

                if (solidVoxels.has(key)) return; // Ya hay un bloque ahí

                // No colocar bloques dentro del jugador (anti-trampa)
                const pp = playerObj.position;
                const overlapsPlayer =
                    Math.abs(pp.x - vx) < 0.8 &&
                    Math.abs(pp.z - vz) < 0.8 &&
                    (pp.y + 0.9 > vy - 0.5) &&
                    (pp.y - 0.9 < vy + 0.5);
                if (overlapsPlayer) return;

                const block = new THREE.Mesh(boxGeo, tm.getBlockMats(selectedBlockType));
                block.position.set(vx, vy, vz);
                block.castShadow = true;
                block.receiveShadow = true;
                block.userData = { isBlock: true, isDynamic: true, blockType: selectedBlockType, name: NAMES[selectedBlockType] || selectedBlockType };
                scene.add(block);
                dynamicBlocks.push(block);
                solidVoxels.add(key);
            }
        }
    });

    // --- BUCLE PRINCIPAL ---
    let prevTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        const delta = Math.min((time - prevTime) / 1000, 0.1);
        prevTime = time;

        // Física
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 25.0 * delta;
        if (velocity.y < -40) velocity.y = -40; // Evita atravesar el suelo cayendo muy rápido

        const dir = new THREE.Vector3();
        dir.z = Number(moveForward) - Number(moveBackward);
        dir.x = Number(moveRight) - Number(moveLeft);
        dir.normalize();

        if (moveForward || moveBackward) velocity.z -= dir.z * 50.0 * delta;
        if (moveLeft || moveRight) velocity.x -= dir.x * 50.0 * delta;

        const prevPos = playerObj.position.clone();

        // Movimiento horizontal + colisión
        playerObj.translateX(velocity.x * delta);
        playerObj.translateZ(velocity.z * delta);
        if (boxCollides(playerObj.position.x, playerObj.position.y, playerObj.position.z)) {
            playerObj.position.x = prevPos.x;
            playerObj.position.z = prevPos.z;
            velocity.x = 0; velocity.z = 0;
        }

        // Movimiento vertical + colisión
        playerObj.translateY(velocity.y * delta);
        if (boxCollides(playerObj.position.x, playerObj.position.y, playerObj.position.z)) {
            if (velocity.y < 0) canJump = true;
            playerObj.position.y = prevPos.y;
            velocity.y = 0;
        }

        // Respawn si caes al vacío
        if (playerObj.position.y < -30) {
            playerObj.position.set(0, 10, 0);
            velocity.set(0, 0, 0);
        }

        // Nubes
        clouds.forEach(cloud => {
            cloud.position.x += cloud.userData.speed;
            if (cloud.position.x > cloud.userData.limit) cloud.position.x = -cloud.userData.limit;
        });

        // Partículas
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.userData.velocity.y -= 0.02;
            p.position.add(p.userData.velocity);
            p.rotation.x += 0.1; p.rotation.y += 0.1;
            p.userData.life--;
            p.scale.multiplyScalar(0.92);
            if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
        }

        // HUD: qué bloque estoy mirando
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const hudTargets = [...dynamicBlocks, ...Object.values(staticMeshes).map(s => s.mesh)];
        const hudHits = raycaster.intersectObjects(hudTargets, false);
        if (hudHits.length > 0 && hudHits[0].distance < 6) {
            const o = hudHits[0].object;
            const name = o.userData.isStatic ? (NAMES[o.userData.type] || o.userData.type) : o.userData.name;
            elBlockName.innerText = "Mirando: " + (name || "Desconocido");
        } else {
            elBlockName.innerText = "Mirando: Aire";
        }
        elCoords.innerText = `X: ${Math.round(playerObj.position.x)} Y: ${Math.round(playerObj.position.y)} Z: ${Math.round(playerObj.position.z)}`;

        // Balanceo de la mano
        handGroup.position.y = -0.6 + Math.sin(time * 0.005) * 0.02;

        renderer.render(scene, camera);
    }
    animate();
}

// ============================================================
// 9. ARRANQUE
// ============================================================
function updateHotbarUI(num) {
    document.querySelectorAll('.hotbar-slot').forEach(s => s.classList.remove('active'));
    const slot = document.getElementById(`slot-${num}`);
    if (slot) slot.classList.add('active');
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function initGame() {
    tm = new TextureManager();
    updateHandModel('grass');   // Mano provisional mientras cargan las texturas
    startPlayerLoop();          // El jugador arranca ya, sin pantalla de carga

    tm.init().then(() => {
        buildWorld();           // El mundo se construye cuando las texturas están listas
        generateClouds();
        updateHandModel('grass');
    });
}

initGame();
</script>
