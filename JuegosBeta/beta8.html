        function handleDeath(message) {
            if (player.health > 0) { // Evitar muertes múltiples
                player.health = 0;
                updateHealthBar();
                showMessage(message);

                // Respawn logic
                setTimeout(() => {
                    const spawnX = Math.floor(WORLD_WIDTH / 2);
                    let spawnY = 0;
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        if (world[y] && world[y][spawnX] && world[y][spawnX] !== 'water' && (!world[y - 1] || !world[y - 1][spawnX])) {
                            spawnY = y * BLOCK_SIZE - player.height;
                            break;
                        }
                    }
                    player.x = spawnX * BLOCK_SIZE;
                    player.y = spawnY;
                    player.health = 8;
                    player.velocityY = 0;
                    updateHealthBar();
                    showMessage("Has reaparecido.");
                }, 1000); // 1 segundo de retraso antes de reaparecer
            }
        }

        function checkLava() {
            const playerLeft = Math.floor(player.x / BLOCK_SIZE);
            const playerRight = Math.floor((player.x + player.width) / BLOCK_SIZE);
            const playerBottom = Math.floor((player.y + player.height) / BLOCK_SIZE);
            const playerTop = Math.floor(player.y / BLOCK_SIZE);

            for (let y = playerTop; y <= playerBottom; y++) {
                for (let x = playerLeft; x <= playerRight; x++) {
                    const block = getBlock(x * BLOCK_SIZE, y * BLOCK_SIZE);
                    if (block === 'lava') {
                        handleDeath('¡Has muerto en la lava!');
                        return;
                    }
                }
            }
        }

        const tooltip = document.getElementById('tooltip');
        const gameContainer = document.getElementById('gameContainer');

        function showTooltip(e) {
            const slot = e.target.closest('.inventorySlot, .fullInventorySlot');
            if (!slot) return;

            let item;
            if (slot.dataset.slot) { // Hotbar
                item = fullInventory[27 + parseInt(slot.dataset.slot)];
            } else if (slot.dataset.inventorySlot) { // Main inventory
                item = fullInventory[parseInt(slot.dataset.inventorySlot)];
            } else if (slot.dataset.craftSlot) { // Crafting grid
                item = craftingGrid[parseInt(slot.dataset.craftSlot)];
            }

            if (item && item.type) {
                tooltip.textContent = blockTypes[item.type].name;
                tooltip.style.display = 'block';
            }
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        function moveTooltip(e) {
            if (tooltip.style.display === 'block') {
                const rect = gameContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                tooltip.style.left = (x + 15) + 'px';
                tooltip.style.top = (y + 15) + 'px';
            }
        }
        
        function handleMouseInput() {
            if (isMouseDown) {
                if (breakCooldown <= 0) {
                    if (mouseButton === 0) {
                        breakBlock(mousePos.x, mousePos.y);
                    } else if (mouseButton === 2) {
                        placeBlock(mousePos.x, mousePos.y);
                    }
                    breakCooldown = BREAK_DELAY;
                } else {
                    breakCooldown--;
                }
            } else {
                breakCooldown = 0;
            }
        }

        let isWorldGenerated = false;
        function gameLoop() {
            if (!isWorldGenerated) {
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = "20px 'Press Start 2P'";
                ctx.textAlign = 'center';
                ctx.fillText('Cargando mundo...', canvas.width / 2, canvas.height / 2);
                requestAnimationFrame(gameLoop);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            updateSky();
            updateGameTime();
            handleMouseInput();
            updatePlayer();
            checkLava();
            updateSaplings();
            updateCamera();
            
            drawWorld();
            drawPlayer();
            drawTargetBlock();
            // drawMinimap() ha sido eliminado
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key >= '1' && e.key <= '9') {
                selectedSlot = parseInt(e.key) - 1;
                document.querySelectorAll('.inventorySlot').forEach(slot => slot.classList.remove('selected'));
                document.querySelectorAll('.inventorySlot')[selectedSlot].classList.add('selected');
                updateToolDisplay(); // Actualizar display de herramienta al cambiar
            }
            
            if (e.key.toLowerCase() === 'e') {
                inventoryOpen = !inventoryOpen;
                const fullInventoryEl = document.getElementById('fullInventory');
                if (inventoryOpen) {
                    fullInventoryEl.classList.add('active');
                    updateFullInventoryDisplay();
                    displayRecipes();
                } else {
                    fullInventoryEl.classList.remove('active');
                }
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = e.clientX - rect.left;
            mousePos.y = e.clientY - rect.top;
        });
        
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (e.button === 0) {
                breakBlock(mouseX, mouseY);
            } else if (e.button === 2) {
                placeBlock(mouseX, mouseY);
            }
        });
        
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        document.querySelectorAll('.inventorySlot').forEach((slot, index) => {
            slot.addEventListener('click', () => {
                selectedSlot = index;
                document.querySelectorAll('.inventorySlot').forEach(s => s.classList.remove('selected'));
                slot.classList.add('selected');
                updateToolDisplay();
            });
        });
        
        // Botón de inventario
        document.getElementById('inventoryButton').addEventListener('click', () => {
            inventoryOpen = !inventoryOpen;
            const fullInventoryEl = document.getElementById('fullInventory');
            if (inventoryOpen) {
                fullInventoryEl.classList.add('active');
                updateFullInventoryDisplay();
                displayRecipes();
            } else {
                fullInventoryEl.classList.remove('active');
            }
        });
        
        // Botón de cerrar inventario
        document.querySelector('.closeButton').addEventListener('click', () => {
            inventoryOpen = false;
            document.getElementById('fullInventory').classList.remove('active');
        });
        
        // Botón de crafteo
        document.getElementById('craftButton').addEventListener('click', craft);
        
        // Event listeners para tooltips
        const inventoryContainer = document.getElementById('fullInventory');
        inventoryContainer.addEventListener('mouseover', showTooltip);
        inventoryContainer.addEventListener('mouseout', hideTooltip);
        inventoryContainer.addEventListener('mousemove', moveTooltip);

        const hotbarContainer = document.getElementById('inventory');
        hotbarContainer.addEventListener('mouseover', showTooltip);
        hotbarContainer.addEventListener('mouseout', hideTooltip);
        hotbarContainer.addEventListener('mousemove', moveTooltip);
        
        // Drag and drop para crafting grid
        document.querySelectorAll('#craftingGrid .fullInventorySlot').forEach((slot, index) => {
            slot.addEventListener('click', () => {
                // Si hay algo en el hotbar seleccionado, añadirlo al crafting grid
                const inventoryIndex = 27 + selectedSlot;
                if (fullInventory[inventoryIndex] && fullInventory[inventoryIndex].type && fullInventory[inventoryIndex].count > 0) {
                    if (!craftingGrid[index] || !craftingGrid[index].type) {
                        craftingGrid[index] = {
                            type: fullInventory[inventoryIndex].type,
                            count: 1
                        };
                        removeFromInventory(inventoryIndex, 1);
                        updateCraftingDisplay();
                    }
                } else if (craftingGrid[index] && craftingGrid[index].type) {
                    // Devolver item al inventario
                    addToInventory(craftingGrid[index].type, craftingGrid[index].count);
                    craftingGrid[index] = { type: null, count: 0 };
                    updateCraftingDisplay();
                }
            });
        });
        
        // Inicializar juego
        gameLoop(); // Inicia el bucle de juego para mostrar "Cargando"

        setTimeout(() => {
            initWorld();
            updateInventoryDisplay();
            updateToolDisplay();
            isWorldGenerated = true; // El mundo ya se generó
            showMessage('¡Recolecta madera y craftea tu primer pico!');
        }, 50); // Timeout para permitir que el mensaje de carga se renderice
    </script>
</body>
</html>
