<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNF Battle Mode - Friday Night Funkin'</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background: #000;
            overflow: hidden;
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fondo animado estilo FNF */
        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a0033 0%, #330066 50%, #4d0099 100%);
            animation: bgPulse 4s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        /* Efectos de fondo */
        .bg-effects {
            position: fixed;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(255, 0, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 70% 60%, rgba(0, 255, 255, 0.3) 0%, transparent 50%);
            animation: bgRotate 20s linear infinite;
        }

        @keyframes bgRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Grid de fondo */
        .grid-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 10s linear infinite;
            opacity: 0.3;
        }

        @keyframes gridMove {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }

        /* Etapa del juego */
        .stage {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 50px;
            z-index: 5;
        }

        /* Contenedor principal */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* UI Superior */
        .ui-top {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            z-index: 100;
        }

        /* Puntuación estilo FNF */
        .score-container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 10px 20px;
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Combo */
        .combo-container {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 10px 20px;
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
            animation: comboGlow 0.5s ease-in-out infinite;
            transform: scale(1);
            transition: transform 0.2s;
        }

        .combo-container.pulse {
            animation: comboPulse 0.3s ease-out;
        }

        @keyframes comboPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        @keyframes comboGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 255, 0.8); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.8); }
        }

        /* Barra de salud */
        .health-bar {
            position: absolute;
            top: 80px;
            width: 400px;
            height: 25px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0066, #ff3366);
            width: 50%;
            transition: width 0.3s ease;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Indicador de turno */
        .turn-indicator {
            position: absolute;
            top: 120px;
            width: 300px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            animation: turnPulse 1s ease-in-out infinite;
        }

        .turn-indicator.player {
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }

        .turn-indicator.opponent {
            border-color: #ff0066;
            box-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
        }

        @keyframes turnPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Personaje oponente */
        .opponent-character {
            position: absolute;
            bottom: 150px;
            right: 100px;
            width: 140px;
            height: 200px;
            background: linear-gradient(135deg, #ff0066, #ff3366);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            box-shadow: 0 10px 30px rgba(255, 0, 102, 0.5);
            animation: opponentIdle 0.6s ease-in-out infinite;
            z-index: 20;
        }

        @keyframes opponentIdle {
            0%, 100% { transform: translateY(0) rotate(2deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
        }

        .opponent-character.singing {
            animation: opponentSing 0.2s ease-out;
        }

        @keyframes opponentSing {
            0% { transform: scale(1) rotate(10deg); }
            50% { transform: scale(1.2) rotate(-10deg); }
            100% { transform: scale(1) rotate(2deg); }
        }

        /* Personaje jugador */
        .player-character {
            position: absolute;
            bottom: 150px;
            left: 100px;
            width: 120px;
            height: 180px;
            background: linear-gradient(135deg, #00ffff, #0099ff);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
            animation: playerIdle 0.5s ease-in-out infinite;
            z-index: 20;
        }

        @keyframes playerIdle {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .player-character.singing {
            animation: playerSing 0.2s ease-out;
        }

        @keyframes playerSing {
            0% { transform: scale(1) rotate(-10deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(-2deg); }
        }

        /* Track de notas del jugador */
        .note-track {
            position: absolute;
            bottom: 0;
            right: 50px;
            width: 500px;
            height: 100vh;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 150px;
            z-index: 15;
        }

        /* Track de notas del oponente */
        .opponent-note-track {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 500px;
            height: 100vh;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 150px;
            z-index: 15;
            transform: scaleX(-1);
        }

        /* Lane individual */
        .lane {
            width: 100px;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lane-bg {
            position: absolute;
            width: 90px;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Receptor de notas estilo FNF */
        .receptor {
            width: 90px;
            height: 90px;
            position: absolute;
            bottom: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: all 0.1s;
        }

        .receptor.left {
            background: linear-gradient(135deg, #ff0066, #ff3366);
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
        }

        .receptor.down {
            background: linear-gradient(135deg, #00ff66, #33ff66);
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.8);
        }

        .receptor.up {
            background: linear-gradient(135deg, #66ff00, #99ff33);
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(102, 255, 0, 0.8);
        }

        .receptor.right {
            background: linear-gradient(135deg, #0066ff, #3366ff);
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.8);
        }

        .receptor.pressed {
            transform: scale(0.85);
            filter: brightness(1.5);
        }

        .receptor.splash {
            animation: splash 0.3s ease-out;
        }

        @keyframes splash {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); filter: brightness(2); }
            100% { transform: scale(1); }
        }

        /* Flechas estilo FNF */
        .arrow {
            width: 70px;
            height: 70px;
            font-size: 50px;
            color: #fff;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        /* Notas estilo FNF */
        .note {
            width: 70px;
            height: 70px;
            position: absolute;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            font-weight: 900;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .note.left {
            background: linear-gradient(135deg, #ff0066, #ff3366);
        }

        .note.down {
            background: linear-gradient(135deg, #00ff66, #33ff66);
        }

        .note.up {
            background: linear-gradient(135deg, #66ff00, #99ff33);
        }

        .note.right {
            background: linear-gradient(135deg, #0066ff, #3366ff);
        }

        .note.player-fall {
            animation: noteFall 2s linear;
        }

        .note.opponent-fall {
            animation: opponentNoteFall 2s linear;
        }

        @keyframes noteFall {
            from {
                top: -70px;
            }
            to {
                top: calc(100vh - 220px);
            }
        }

        @keyframes opponentNoteFall {
            from {
                top: -70px;
            }
            to {
                top: calc(100vh - 220px);
            }
        }

        /* Efectos de hit */
        .hit-effect {
            position: absolute;
            width: 100px;
            height: 100px;
            pointer-events: none;
            animation: hitBurst 0.5s ease-out forwards;
            z-index: 50;
        }

        @keyframes hitBurst {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(2) rotate(180deg);
                opacity: 0;
            }
        }

        .hit-effect .rating {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000;
        }

        .hit-effect.perfect .rating {
            color: #ffd700;
        }

        .hit-effect.good .rating {
            color: #00ff00;
        }

        .hit-effect.bad .rating {
            color: #ff0000;
        }

        /* Juicio flotante */
        .judgment {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
            animation: judgmentFloat 1s ease-out forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes judgmentFloat {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(0) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) translateY(-20px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-40px) scale(1);
            }
        }

        .judgment.perfect { color: #ffd700; }
        .judgment.good { color: #00ff00; }
        .judgment.bad { color: #ff0000; }
        .judgment.miss { color: #ff0066; }

        /* Pantalla de inicio */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 80px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titlePulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .start-btn {
            padding: 20px 60px;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 0, 255, 0.7);
        }

        .instructions {
            color: #fff;
            margin-top: 30px;
            text-align: center;
            font-size: 20px;
            opacity: 0.8;
        }

        /* Game Over */
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            z-index: 1000;
            display: none;
            border: 3px solid #ff0066;
            box-shadow: 0 0 30px rgba(255, 0, 102, 0.8);
        }

        .game-over.show {
            display: block;
            animation: gameOverAppear 0.5s ease-out;
        }

        @keyframes gameOverAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .game-over h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff0066;
            text-shadow: 2px 2px 0 #000;
        }

        .final-score {
            font-size: 32px;
            margin-bottom: 30px;
            color: #ffd700;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }

        /* Controles en pantalla */
        .on-screen-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .key-hint {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            border-radius: 10px;
            color: #fff;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            opacity: 0.5;
            transition: all 0.2s;
        }

        .key-hint.active {
            opacity: 1;
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Efecto de bloqueo durante turno del oponente */
        .blocked-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 102, 0.1);
            pointer-events: none;
            z-index: 90;
            display: none;
        }

        .blocked-overlay.active {
            display: block;
            animation: blockPulse 0.5s ease-in-out infinite;
        }

        @keyframes blockPulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="bg-effects"></div>
    <div class="grid-bg"></div>

    <!-- Overlay de bloqueo -->
    <div class="blocked-overlay" id="blockedOverlay"></div>

    <!-- Pantalla de inicio -->
    <div class="start-screen" id="startScreen">
        <h1 class="game-title">FNF BATTLE MODE</h1>
        <button class="start-btn" onclick="startGame()">BATTLE!</button>
        <div class="instructions">
            <p>USE ARROW KEYS: ← ↓ ↑ →</p>
            <p>BEAT YOUR OPPONENT IN THIS RAP BATTLE!</p>
        </div>
    </div>

    <!-- Contenedor del juego -->
    <div class="game-container">
        <!-- UI Superior -->
        <div class="ui-top">
            <div class="score-container">
                SCORE: <span id="score">0</span>
            </div>
            <div class="combo-container" id="comboDisplay">
                <span id="combo">0</span> COMBO
            </div>
        </div>

        <!-- Barra de salud -->
        <div class="health-bar">
            <div class="health-fill" id="healthFill"></div>
        </div>

        <!-- Indicador de turno -->
        <div class="turn-indicator player" id="turnIndicator">
            YOUR TURN
        </div>

        <!-- Personaje oponente -->
        <div class="opponent-character" id="opponent">🎸</div>

        <!-- Personaje jugador -->
        <div class="player-character" id="player">🎤</div>

        <!-- Track de notas del oponente -->
        <div class="opponent-note-track">
            <div class="lane">
                <div class="lane-bg"></div>
                <div class="receptor left" data-key="ArrowLeft">
                    <div class="arrow">←</div>
                </div>
            </div>
            <div class="lane">
                <div class="lane-bg"></div>
                <div class="receptor down" data-key="ArrowDown">
                    <div class="arrow">↓</div>
                </div>
            </div>
            <div class="lane">
                <div class="lane-bg"></div>
                <div class="receptor up" data-key="ArrowUp">
                    <div class="arrow">↑</div>
                </div>
            </div>
            <div class="lane">
                <div class="lane-bg"></div>
                <div class="receptor right" data-key="ArrowRight">
                    <div class="arrow">→</div>
                </div>
            </div>
        </div>

        <!-- Track de notas del jugador -->
        <div class="note-track">
            <div class="lane">
                <div class="lane-bg"></div>
                <div class="receptor left" data-key="ArrowLeft">
                    <div class="arrow">←</div>
                </div>
            </div>
            <div class="lane">
                <div class="lane-bg"></div>
                <div class="receptor down" data-key="ArrowDown">
                    <div class="arrow">↓</div>
                </div>
            </div>
            <div class="lane">
                <div class="lane-bg"></div>
                <div class="receptor up" data-key="ArrowUp">
                    <div class="arrow">↑</div>
                </div>
            </div>
            <div class="lane">
                <div class="lane-bg"></div>
                <div class="receptor right" data-key="ArrowRight">
                    <div class="arrow">→</div>
                </div>
            </div>
        </div>

        <!-- Controles en pantalla -->
        <div class="on-screen-controls">
            <div class="key-hint" data-key="ArrowLeft">←</div>
            <div class="key-hint" data-key="ArrowDown">↓</div>
            <div class="key-hint" data-key="ArrowUp">↑</div>
            <div class="key-hint" data-key="ArrowRight">→</div>
        </div>
    </div>

    <!-- Pantalla de Game Over -->
    <div class="game-over" id="gameOver">
        <h2>GAME OVER</h2>
        <div class="final-score">SCORE: <span id="finalScore">0</span></div>
        <button class="restart-btn" onclick="restartGame()">TRY AGAIN</button>
    </div>

    <script>
        // Variables del juego
        let score = 0;
        let combo = 0;
        let health = 50;
        let gameActive = false;
        let noteSpeed = 2000;
        let playerNotes = [];
        let opponentNotes = [];
        let isPlayerTurn = true;
        let turnTimer;
        let noteGenerationTimer;
        let opponentNoteTimer;
        let keys = {
            'ArrowLeft': false,
            'ArrowDown': false,
            'ArrowUp': false,
            'ArrowRight': false
        };

        // Patrones de notas para el oponente
        const opponentPatterns = [
            ['left', 'down', 'up', 'right'],
            ['left', 'right', 'down', 'up'],
            ['up', 'up', 'down', 'down'],
            ['left', 'left', 'right', 'right'],
            ['left', 'down', 'up', 'right', 'left', 'down'],
            ['up', 'right', 'down', 'left', 'up']
        ];

        // Iniciar juego
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            gameActive = true;
            score = 0;
            combo = 0;
            health = 50;
            isPlayerTurn = true;
            updateUI();
            startTurnSystem();
            gameLoop();
        }

        // Sistema de turnos
        function startTurnSystem() {
            switchTurn();
            
            // Generar notas del jugador
            noteGenerationTimer = setInterval(() => {
                if (gameActive && isPlayerTurn) {
                    generatePlayerNote();
                }
            }, 600);
        }

        // Cambiar turno
        function switchTurn() {
            isPlayerTurn = !isPlayerTurn;
            const turnIndicator = document.getElementById('turnIndicator');
            const blockedOverlay = document.getElementById('blockedOverlay');
            
            if (isPlayerTurn) {
                turnIndicator.textContent = 'YOUR TURN';
                turnIndicator.className = 'turn-indicator player';
                blockedOverlay.classList.remove('active');
                
                // Generar notas del jugador
                startPlayerNotes();
            } else {
                turnIndicator.textContent = "OPPONENT'S TURN";
                turnIndicator.className = 'turn-indicator opponent';
                blockedOverlay.classList.add('active');
                
                // Generar notas del oponente
                startOpponentNotes();
            }
            
            // Cambiar de turno cada 8 segundos
            clearTimeout(turnTimer);
            turnTimer = setTimeout(() => {
                if (gameActive) {
                    switchTurn();
                }
            }, 8000);
        }

        // Generar nota del jugador
        function generatePlayerNote() {
            const lanes = ['left', 'down', 'up', 'right'];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            createNote(randomLane, 'player');
        }

        // Crear nota
        function createNote(lane, owner) {
            const note = document.createElement('div');
            note.className = `note ${lane} ${owner}-fall`;
            note.innerHTML = getArrowSymbol(lane);
            note.dataset.lane = lane;
            note.dataset.owner = owner;
            
            const track = owner === 'player' ? 
                document.querySelector('.note-track') : 
                document.querySelector('.opponent-note-track');
            
            const laneElement = track.querySelector(`.lane:has(.receptor[data-key="Arrow${getKeyName(lane)}"])`);
            laneElement.appendChild(note);
            
            if (owner === 'player') {
                playerNotes.push(note);
            } else {
                opponentNotes.push(note);
            }
            
            // Remover nota después de la animación
            setTimeout(() => {
                if (note.parentNode) {
                    note.remove();
                    if (owner === 'player') {
                        playerNotes = playerNotes.filter(n => n !== note);
                        if (gameActive && isPlayerTurn) {
                            missNote();
                        }
                    } else {
                        opponentNotes = opponentNotes.filter(n => n !== note);
                    }
                }
            }, noteSpeed);
        }

        // Iniciar notas del oponente
        function startOpponentNotes() {
            let patternIndex = 0;
            let noteIndex = 0;
            
            opponentNoteTimer = setInterval(() => {
                if (!gameActive || isPlayerTurn) {
                    clearInterval(opponentNoteTimer);
                    return;
                }
                
                const pattern = opponentPatterns[patternIndex % opponentPatterns.length];
                const lane = pattern[noteIndex % pattern.length];
                createNote(lane, 'opponent');
                
                // Simular que el oponente presiona la nota
                setTimeout(() => {
                    if (!isPlayerTurn && gameActive) {
                        opponentHitNote(lane);
                    }
                }, noteSpeed - 200);
                
                noteIndex++;
                if (noteIndex >= pattern.length) {
                    noteIndex = 0;
                    patternIndex++;
                }
            }, 400);
        }

        // Oponente acierta nota
        function opponentHitNote(lane) {
            const receptor = document.querySelector(`.opponent-note-track .receptor[data-key="Arrow${getKeyName(lane)}"]`);
            const note = opponentNotes.find(n => n.dataset.lane === lane && n.dataset.owner === 'opponent');
            
            if (note && receptor) {
                removeNote(note, 'opponent');
                receptor.classList.add('splash');
                setTimeout(() => receptor.classList.remove('splash'), 300);
                
                // Animar oponente
                animateOpponent();
                
                // Reducir salud del jugador
                health = Math.max(0, health - 2);
                updateUI();
            }
        }

        // Iniciar notas del jugador
        function startPlayerNotes() {
            // Las notas ya se generan automáticamente en el intervalo
        }

        // Obtener símbolo de flecha
        function getArrowSymbol(lane) {
            const symbols = {
                'left': '←',
                'down': '↓',
                'up': '↑',
                'right': '→'
            };
            return symbols[lane];
        }

        // Obtener nombre de tecla
        function getKeyName(lane) {
            const keyNames = {
                'left': 'Left',
                'down': 'Down',
                'up': 'Up',
                'right': 'Right'
            };
            return keyNames[lane];
        }

        // Manejar teclas presionadas
        document.addEventListener('keydown', (e) => {
            if (!gameActive || !isPlayerTurn) return;
            
            if (keys.hasOwnProperty(e.key) && !keys[e.key]) {
                keys[e.key] = true;
                handleKeyPress(e.key);
                
                // Animar receptor
                const receptor = document.querySelector(`.note-track .receptor[data-key="${e.key}"]`);
                if (receptor) {
                    receptor.classList.add('pressed');
                    setTimeout(() => receptor.classList.remove('pressed'), 100);
                }
                
                // Animar hint
                const hint = document.querySelector(`.key-hint[data-key="${e.key}"]`);
                if (hint) {
                    hint.classList.add('active');
                    setTimeout(() => hint.classList.remove('active'), 100);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = false;
            }
        });

        // Manejar presión de tecla
        function handleKeyPress(key) {
            const receptor = document.querySelector(`.note-track .receptor[data-key="${key}"]`);
            if (!receptor) return;
            
            const lane = receptor.parentElement;
            const notesInLane = lane.querySelectorAll('.note');
            
            for (let note of notesInLane) {
                const noteRect = note.getBoundingClientRect();
                const receptorRect = receptor.getBoundingClientRect();
                const distance = Math.abs(noteRect.bottom - receptorRect.top);
                
                if (distance < 40) {
                    // Perfect
                    perfectHit(note, receptor);
                    break;
                } else if (distance < 80) {
                    // Good
                    goodHit(note, receptor);
                    break;
                } else if (distance < 120) {
                    // Bad
                    badHit(note, receptor);
                    break;
                }
            }
        }

        // Perfect hit
        function perfectHit(note, receptor) {
            removeNote(note, 'player');
            score += 350;
            combo++;
            health = Math.min(100, health + 3);
            
            receptor.classList.add('splash');
            setTimeout(() => receptor.classList.remove('splash'), 300);
            
            createHitEffect(receptor, 'PERFECT', 'perfect');
            showJudgment('PERFECT', 'perfect');
            animatePlayer();
            
            updateUI();
        }

        // Good hit
        function goodHit(note, receptor) {
            removeNote(note, 'player');
            score += 200;
            combo++;
            health = Math.min(100, health + 2);
            
            createHitEffect(receptor, 'GOOD', 'good');
            showJudgment('GOOD', 'good');
            animatePlayer();
            
            updateUI();
        }

        // Bad hit
        function badHit(note, receptor) {
            removeNote(note, 'player');
            score += 50;
            combo = 0;
            health = Math.max(0, health - 3);
            
            createHitEffect(receptor, 'BAD', 'bad');
            showJudgment('BAD', 'bad');
            
            updateUI();
        }

        // Miss note
        function missNote() {
            combo = 0;
            health = Math.max(0, health - 5);
            showJudgment('MISS', 'miss');
            updateUI();
        }

        // Remover nota
        function removeNote(note, owner) {
            note.remove();
            if (owner === 'player') {
                playerNotes = playerNotes.filter(n => n !== note);
            } else {
                opponentNotes = opponentNotes.filter(n => n !== note);
            }
        }

        // Crear efecto de hit
        function createHitEffect(receptor, text, type) {
            const effect = document.createElement('div');
            effect.className = `hit-effect ${type}`;
            effect.innerHTML = `<div class="rating">${text}</div>`;
            const rect = receptor.getBoundingClientRect();
            effect.style.left = rect.left + rect.width/2 - 50 + 'px';
            effect.style.top = rect.top + rect.height/2 - 50 + 'px';
            document.body.appendChild(effect);
            
            setTimeout(() => effect.remove(), 500);
        }

        // Mostrar juicio
        function showJudgment(text, type) {
            const judgment = document.createElement('div');
            judgment.className = `judgment ${type}`;
            judgment.textContent = text;
            document.querySelector('.game-container').appendChild(judgment);
            
            setTimeout(() => judgment.remove(), 1000);
        }

        // Animar jugador
        function animatePlayer() {
            const player = document.getElementById('player');
            player.classList.remove('singing');
            void player.offsetWidth;
            player.classList.add('singing');
            setTimeout(() => player.classList.remove('singing'), 200);
        }

        // Animar oponente
        function animateOpponent() {
            const opponent = document.getElementById('opponent');
            opponent.classList.remove('singing');
            void opponent.offsetWidth;
            opponent.classList.add('singing');
            setTimeout(() => opponent.classList.remove('singing'), 200);
        }

        // Actualizar UI
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('combo').textContent = combo;
            document.getElementById('healthFill').style.width = health + '%';
            
            // Animar combo
            if (combo > 0 && combo % 10 === 0) {
                const comboDisplay = document.getElementById('comboDisplay');
                comboDisplay.classList.add('pulse');
                setTimeout(() => comboDisplay.classList.remove('pulse'), 300);
            }
            
            // Cambiar color de la barra de salud
            const healthFill = document.getElementById('healthFill');
            if (health < 20) {
                healthFill.style.background = 'linear-gradient(90deg, #ff0000, #ff3333)';
            } else if (health < 50) {
                healthFill.style.background = 'linear-gradient(90deg, #ff6600, #ff9933)';
            } else {
                healthFill.style.background = 'linear-gradient(90deg, #ff0066, #ff3366)';
            }
        }

        // Game loop
        function gameLoop() {
            if (!gameActive) return;
            
            // Disminuir salud gradualmente
            health = Math.max(0, health - 0.02);
            updateUI();
            
            // Game Over si la salud llega a 0
            if (health <= 0) {
                endGame();
                return;
            }
            
            // Aumentar dificultad
            if (score > 1000 && noteSpeed > 1600) {
                noteSpeed = 1600;
            } else if (score > 2500 && noteSpeed > 1300) {
                noteSpeed = 1300;
            } else if (score > 5000 && noteSpeed > 1000) {
                noteSpeed = 1000;
            }
            
            requestAnimationFrame(gameLoop);
        }

        // Finalizar juego
        function endGame() {
            gameActive = false;
            clearInterval(noteGenerationTimer);
            clearInterval(opponentNoteTimer);
            clearTimeout(turnTimer);
            
            // Limpiar notas
            playerNotes.forEach(note => {
                if (note.parentNode) note.remove();
            });
            opponentNotes.forEach(note => {
                if (note.parentNode) note.remove();
            });
            playerNotes = [];
            opponentNotes = [];
            
            // Mostrar pantalla de game over
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').classList.add('show');
        }

        // Reiniciar juego
        function restartGame() {
            document.getElementById('gameOver').classList.remove('show');
            document.getElementById('blockedOverlay').classList.remove('active');
            noteSpeed = 2000;
            startGame();
        }
    </script>
</body>
</html>
