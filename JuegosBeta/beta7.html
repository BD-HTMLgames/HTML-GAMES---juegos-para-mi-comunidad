<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireboy and Watergirl - Templo del Legado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            background: #000;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 2px solid #333;
        }

        canvas {
            border: 3px solid #444;
            border-radius: 10px;
            display: block;
            background: #1a1611;
        }

        .ui-panel {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            border: 2px solid #444;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-size: 13px;
            border: 2px solid #444;
            backdrop-filter: blur(5px);
            z-index: 10;
            display: flex;
            gap: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .control-keys {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .key {
            background: #333;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #555;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
            transition: all 0.2s;
        }

        .key.active {
            background: #ff6b6b;
            transform: scale(0.95);
        }

        .fire-controls .key.active {
            background: #ff6b6b;
        }

        .water-controls .key.active {
            background: #4ecdc4;
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            z-index: 100;
            border: 2px solid #444;
            animation: fadeInOut 2s ease-in-out;
        }

        .level-transition {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            border: 3px solid #444;
            animation: levelPulse 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
        }

        @keyframes levelPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .fire-color { color: #ff6b6b; }
        .water-color { color: #4ecdc4; }

        .stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hearts {
            display: flex;
            gap: 3px;
        }

        .heart {
            color: #ff4444;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="ui-panel">
            <div class="stats">
                <div class="stat-item">
                    <span>Nivel:</span>
                    <span id="currentLevel" style="font-weight: bold;">1</span>
                </div>
                <div class="stat-item">
                    <span>Puntos:</span>
                    <span id="score" style="font-weight: bold; color: #ffd700;">0</span>
                </div>
                <div class="stat-item">
                    <span>Vidas:</span>
                    <div class="hearts" id="hearts">
                        <span class="heart">❤️</span>
                        <span class="heart">❤️</span>
                        <span class="heart">❤️</span>
                    </div>
                </div>
                <div class="stat-item">
                    <span>⏱️</span>
                    <span id="timer">00:00</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="900" height="500"></canvas>

        <div class="controls">
            <div class="control-group fire-controls">
                <span class="fire-color">🔥 Fireboy</span>
                <div class="control-keys">
                    <div class="key" id="fire-left">A</div>
                    <div class="key" id="fire-up">W</div>
                    <div class="key" id="fire-right">D</div>
                </div>
            </div>
            <div class="control-group water-controls">
                <span class="water-color">💧 Watergirl</span>
                <div class="control-keys">
                    <div class="key" id="water-left">←</div>
                    <div class="key" id="water-up">↑</div>
                    <div class="key" id="water-right">→</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        const gameState = {
            currentLevel: 1,
            score: 0,
            lives: 3,
            timer: 0,
            isPlaying: true,
            transitioning: false,
            particles: []
        };

        // Load character images
        const fireboyImg = new Image();
        const watergirlImg = new Image();
        let imagesLoaded = 0;

        fireboyImg.src = 'https://ik.imagekit.io/rx3s8imfb/GIF%20E%20IMAGENES/imagen_2026-03-24_113155005-removebg-preview.png';
        watergirlImg.src = 'https://ik.imagekit.io/rx3s8imfb/GIF%20E%20IMAGENES/imagen_2026-03-24_113221934-removebg-preview.png';

        fireboyImg.onload = () => {
            imagesLoaded++;
            if (imagesLoaded === 2) {
                startGame();
            }
        };

        watergirlImg.onload = () => {
            imagesLoaded++;
            if (imagesLoaded === 2) {
                startGame();
            }
        };

        // Particle class
        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.life = 1.0;
                this.decay = 0.02;
                this.size = Math.random() * 3 + 2;
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.velocity.y += 0.1;
                this.life -= this.decay;
                this.size *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Player class
        class Player {
            constructor(x, y, type, color) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 40;
                this.type = type;
                this.color = color;
                this.velocityX = 0;
                this.velocityY = 0;
                this.speed = 3;
                this.jumpPower = 10;
                this.gravity = 0.4;
                this.onGround = false;
                this.invulnerable = false;
                this.invulnerableTime = 0;
                this.gemsCollected = 0;
            }

            moveLeft() {
                this.velocityX = -this.speed;
            }

            moveRight() {
                this.velocityX = this.speed;
            }

            jump() {
                if (this.onGround) {
                    this.velocityY = -this.jumpPower;
                    this.createJumpParticles();
                }
            }

            createJumpParticles() {
                for (let i = 0; i < 5; i++) {
                    gameState.particles.push(new Particle(
                        this.x + this.width/2,
                        this.y + this.height,
                        this.type === 'fire' ? '#ff6b6b' : '#4ecdc4',
                        {
                            x: (Math.random() - 0.5) * 2,
                            y: Math.random() * -1
                        }
                    ));
                }
            }

            update() {
                // Apply gravity
                this.velocityY += this.gravity;
                
                // Update position
                this.x += this.velocityX;
                this.y += this.velocityY;
                
                // Friction
                this.velocityX *= 0.85;
                
                // Boundaries
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
                
                // Ground collision
                if (this.y + this.height > canvas.height - 20) {
                    this.y = canvas.height - 20 - this.height;
                    this.velocityY = 0;
                    this.onGround = true;
                } else {
                    this.onGround = false;
                }
                
                // Platform collision
                this.checkPlatformCollision();
                
                // Hazard collision
                this.checkHazardCollision();
                
                // Gem collection
                this.checkGemCollection();
                
                // Door activation
                this.checkDoorActivation();
                
                // Update invulnerability
                if (this.invulnerable) {
                    this.invulnerableTime--;
                    if (this.invulnerableTime <= 0) {
                        this.invulnerable = false;
                    }
                }
            }

            checkPlatformCollision() {
                if (!currentLevel) return;
                
                currentLevel.platforms.forEach(platform => {
                    if (this.x < platform.x + platform.width &&
                        this.x + this.width > platform.x &&
                        this.y < platform.y + platform.height &&
                        this.y + this.height > platform.y) {
                        
                        // Top collision
                        if (this.velocityY > 0 && this.y < platform.y) {
                            this.y = platform.y - this.height;
                            this.velocityY = 0;
                            this.onGround = true;
                        }
                        // Bottom collision
                        else if (this.velocityY < 0 && this.y > platform.y) {
                            this.y = platform.y + platform.height;
                            this.velocityY = 0;
                        }
                        // Side collisions
                        else if (this.velocityX > 0) {
                            this.x = platform.x - this.width;
                            this.velocityX = 0;
                        } else if (this.velocityX < 0) {
                            this.x = platform.x + platform.width;
                            this.velocityX = 0;
                        }
                    }
                });
            }

            checkHazardCollision() {
                if (!currentLevel || this.invulnerable) return;
                
                currentLevel.hazards.forEach(hazard => {
                    if (this.x < hazard.x + hazard.width &&
                        this.x + this.width > hazard.x &&
                        this.y < hazard.y + hazard.height &&
                        this.y + this.height > hazard.y) {
                        
                        // Check if player can survive hazard
                        if ((this.type === 'fire' && hazard.type === 'fire') ||
                            (this.type === 'water' && hazard.type === 'water')) {
                            // Player dies
                            this.takeDamage();
                        } else if (hazard.type === 'mixed') {
                            // Acid kills both
                            this.takeDamage();
                        }
                    }
                });
            }

            takeDamage() {
                gameState.lives--;
                this.invulnerable = true;
                this.invulnerableTime = 120;
                
                // Update hearts display
                const hearts = document.querySelectorAll('.heart');
                hearts.forEach((heart, index) => {
                    if (index >= gameState.lives) {
                        heart.style.opacity = '0.3';
                    }
                });
                
                // Create damage particles
                for (let i = 0; i < 10; i++) {
                    gameState.particles.push(new Particle(
                        this.x + this.width/2,
                        this.y + this.height/2,
                        '#ff0000',
                        {
                            x: (Math.random() - 0.5) * 5,
                            y: (Math.random() - 0.5) * 5
                        }
                    ));
                }
                
                if (gameState.lives <= 0) {
                    gameOver();
                } else {
                    // Reset position
                    if (this.type === 'fire') {
                        this.x = currentLevel.fireStart.x;
                        this.y = currentLevel.fireStart.y;
                    } else {
                        this.x = currentLevel.waterStart.x;
                        this.y = currentLevel.waterStart.y;
                    }
                    this.velocityX = 0;
                    this.velocityY = 0;
                }
            }

            checkGemCollection() {
                if (!currentLevel) return;
                
                currentLevel.gems = currentLevel.gems.filter(gem => {
                    const distance = Math.sqrt(
                        Math.pow(this.x + this.width/2 - (gem.x + gem.size/2), 2) +
                        Math.pow(this.y + this.height/2 - (gem.y + gem.size/2), 2)
                    );
                    
                    if (distance < this.width/2 + gem.size/2) {
                        // Check gem type
                        if ((this.type === 'fire' && gem.type === 'fire') ||
                            (this.type === 'water' && gem.type === 'water')) {
                            // Collect gem
                            gameState.score += 100;
                            document.getElementById('score').textContent = gameState.score;
                            this.gemsCollected++;
                            
                            // Create collection particles
                            for (let i = 0; i < 8; i++) {
                                gameState.particles.push(new Particle(
                                    gem.x + gem.size/2,
                                    gem.y + gem.size/2,
                                    gem.type === 'fire' ? '#ff6b6b' : '#4ecdc4',
                                    {
                                        x: (Math.random() - 0.5) * 4,
                                        y: (Math.random() - 0.5) * 4
                                    }
                                ));
                            }
                            
                            return false;
                        }
                    }
                    return true;
                });
            }

            checkDoorActivation() {
                if (!currentLevel) return;
                
                currentLevel.doors.forEach(door => {
                    if (door.type === this.type) {
                        if (this.x < door.x + door.width &&
                            this.x + this.width > door.x &&
                            this.y < door.y + door.height &&
                            this.y + this.height > door.y) {
                            door.activated = true;
                            
                            // Create activation particles
                            for (let i = 0; i < 5; i++) {
                                gameState.particles.push(new Particle(
                                    door.x + door.width/2,
                                    door.y + door.height/2,
                                    this.color,
                                    {
                                        x: (Math.random() - 0.5) * 3,
                                        y: (Math.random() - 0.5) * 3
                                    }
                                ));
                            }
                        }
                    }
                });
            }

            draw() {
                ctx.save();
                
                // Flash effect when invulnerable
                if (this.invulnerable && Math.floor(this.invulnerableTime / 5) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                
                // Draw character image
                const img = this.type === 'fire' ? fireboyImg : watergirlImg;
                if (img.complete) {
                    ctx.drawImage(img, this.x, this.y, this.width, this.height);
                } else {
                    // Fallback to colored rectangle if image not loaded
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
                
                ctx.restore();
            }
        }

        function handleInput() {
            if (!gameState.isPlaying || !fireboy || !watergirl) return;

            // Fireboy controls (WASD)
            if (keys['w']) fireboy.jump();
            if (keys['a']) fireboy.moveLeft();
            if (keys['d']) fireboy.moveRight();

            // Watergirl controls (Arrow keys)
            if (keys['arrowup']) watergirl.jump();
            if (keys['arrowleft']) watergirl.moveLeft();
            if (keys['arrowright']) watergirl.moveRight();
        }

        function loadLevel(levelNum) {
            const levelData = levels[levelNum];
            if (!levelData) return;

            currentLevel = JSON.parse(JSON.stringify(levelData));
            fireboy = new Player(
                currentLevel.fireStart.x,
                currentLevel.fireStart.y,
                'fire',
                '#ff6b6b'
            );
            watergirl = new Player(
                currentLevel.waterStart.x,
                currentLevel.waterStart.y,
                'water',
                '#4ecdc4'
            );
            
            gameState.currentLevel = levelNum;
            document.getElementById('currentLevel').textContent = levelNum;
            document.getElementById('score').textContent = gameState.score;
        }

        function drawCaveBackground() {
            // Dark cave background
            const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width/2);
            gradient.addColorStop(0, '#2c2416');
            gradient.addColorStop(0.5, '#1a1611');
            gradient.addColorStop(1, '#0d0b08');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cave texture
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 80 + 40;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw stalactites
            ctx.fillStyle = '#3e2723';
            for (let i = 0; i < 12; i++) {
                const x = (i + 1) * (canvas.width / 13);
                const height = Math.random() * 25 + 15;
                ctx.beginPath();
                ctx.moveTo(x - 10, 0);
                ctx.lineTo(x + 10, 0);
                ctx.lineTo(x, height);
                ctx.closePath();
                ctx.fill();
            }

            // Draw vines
            ctx.strokeStyle = '#2e7d32';
            ctx.lineWidth = 3;
            for (let i = 0; i < 8; i++) {
                const x = Math.random() * canvas.width;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                for (let j = 0; j < 10; j++) {
                    const y = j * 50;
                    const offset = Math.sin(j * 0.5 + Date.now() * 0.001) * 10;
                    ctx.lineTo(x + offset, y);
                }
                ctx.stroke();
            }
        }

        function drawPlatform(platform) {
            if (platform.type === 'wood') {
                // Wooden platform with grain
                const gradient = ctx.createLinearGradient(platform.x, platform.y, platform.x, platform.y + platform.height);
                gradient.addColorStop(0, '#8d6e63');
                gradient.addColorStop(0.5, '#6d4c41');
                gradient.addColorStop(1, '#5d4037');
                ctx.fillStyle = gradient;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                
                // Wood grain
                ctx.strokeStyle = '#4e342e';
                ctx.lineWidth = 1;
                for (let i = 0; i < platform.width; i += 8) {
                    ctx.beginPath();
                    ctx.moveTo(platform.x + i, platform.y);
                    ctx.lineTo(platform.x + i + 3, platform.y + platform.height);
                    ctx.stroke();
                }
                
                // Moss patches
                ctx.fillStyle = '#4caf50';
                for (let i = 0; i < platform.width; i += 20) {
                    if (Math.random() < 0.3) {
                        ctx.fillRect(platform.x + i, platform.y, 5, 3);
                    }
                }
            } else if (platform.type === 'bridge') {
                // Hanging bridge
                ctx.strokeStyle = '#5d4037';
                ctx.lineWidth = 2;
                
                // Bridge planks
                for (let i = 0; i < platform.width; i += 15) {
                    ctx.fillStyle = '#8d6e63';
                    ctx.fillRect(platform.x + i, platform.y, 12, platform.height);
                }
                
                // Ropes
                ctx.beginPath();
                ctx.moveTo(platform.x, platform.y - 5);
                ctx.lineTo(platform.x + platform.width, platform.y - 5);
                ctx.moveTo(platform.x, platform.y + platform.height + 5);
                ctx.lineTo(platform.x + platform.width, platform.y + platform.height + 5);
                ctx.stroke();
                
                // Vertical ropes
                for (let i = 0; i <= platform.width; i += 30) {
                    ctx.beginPath();
                    ctx.moveTo(platform.x + i, platform.y - 5);
                    ctx.lineTo(platform.x + i, platform.y + platform.height + 5);
                    ctx.stroke();
                }
            } else {
                // Stone platform
                const gradient = ctx.createLinearGradient(platform.x, platform.y, platform.x, platform.y + platform.height);
                gradient.addColorStop(0, '#616161');
                gradient.addColorStop(0.5, '#424242');
                gradient.addColorStop(1, '#212121');
                ctx.fillStyle = gradient;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                
                // Stone texture
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                for (let i = 0; i < platform.width; i += 25) {
                    for (let j = 0; j < platform.height; j += 25) {
                        if (Math.random() < 0.4) {
                            ctx.fillRect(platform.x + i, platform.y + j, 12, 12);
                        }
                    }
                }
            }
            
            // Platform border
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(platform.x, platform.y, platform.width, platform.height);
        }

        function drawHazard(hazard) {
            if (hazard.type === 'mixed') {
                // Acid pool
                const gradient = ctx.createLinearGradient(hazard.x, hazard.y, hazard.x + hazard.width, hazard.y);
                gradient.addColorStop(0, '#4caf50');
                gradient.addColorStop(0.5, '#388e3c');
                gradient.addColorStop(1, '#2e7d32');
                ctx.fillStyle = gradient;
                ctx.fillRect(hazard.x, hazard.y, hazard.width, hazard.height);
                
                // Bubbles
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                for (let i = 0; i < hazard.width; i += 12) {
                    const offset = Math.sin((Date.now() * 0.003 + i * 0.3)) * 2;
                    const bubbleY = hazard.y + offset + Math.sin(Date.now() * 0.004 + i) * 2;
                    ctx.beginPath();
                    ctx.arc(hazard.x + i + 6, bubbleY, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (hazard.type === 'fire') {
                // Lava pool
                const gradient = ctx.createLinearGradient(hazard.x, hazard.y, hazard.x, hazard.y + hazard.height);
                gradient.addColorStop(0, '#ff5722');
                gradient.addColorStop(0.5, '#e64a19');
                gradient.addColorStop(1, '#d84315');
                ctx.fillStyle = gradient;
                ctx.fillRect(hazard.x, hazard.y, hazard.width, hazard.height);
                
                // Lava bubbles
                ctx.fillStyle = 'rgba(255, 152, 0, 0.6)';
                for (let i = 0; i < hazard.width; i += 10) {
                    const offset = Math.sin((Date.now() * 0.004 + i * 0.4)) * 3;
                    const bubbleY = hazard.y + offset + Math.sin(Date.now() * 0.005 + i) * 2;
                    ctx.beginPath();
                    ctx.arc(hazard.x + i + 5, bubbleY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                // Water pool
                const gradient = ctx.createLinearGradient(hazard.x, hazard.y, hazard.x, hazard.y + hazard.height);
                gradient.addColorStop(0, '#03a9f4');
                gradient.addColorStop(0.5, '#0288d1');
                gradient.addColorStop(1, '#0277bd');
                ctx.fillStyle = gradient;
                ctx.fillRect(hazard.x, hazard.y, hazard.width, hazard.height);
                
                // Water ripples
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                for (let i = 0; i < hazard.width; i += 15) {
                    const offset = Math.sin((Date.now() * 0.002 + i * 0.2)) * 2;
                    ctx.beginPath();
                    ctx.arc(hazard.x + i + 7, hazard.y + hazard.height/2 + offset, 4, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        function drawGem(gem) {
            ctx.save();
            ctx.translate(gem.x + gem.size/2, gem.y + gem.size/2);
            ctx.rotate(Date.now() * 0.002);
            
            // Gem glow
            const glowGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, gem.size * 1.5);
            glowGradient.addColorStop(0, gem.type === 'fire' ? 'rgba(255, 107, 107, 0.8)' : 'rgba(78, 205, 196, 0.8)');
            glowGradient.addColorStop(0.5, gem.type === 'fire' ? 'rgba(255, 107, 107, 0.4)' : 'rgba(78, 205, 196, 0.4)');
            glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glowGradient;
            ctx.fillRect(-gem.size * 1.5, -gem.size * 1.5, gem.size * 3, gem.size * 3);
            
            // Diamond shape
            ctx.fillStyle = gem.type === 'fire' ? '#ff6b6b' : '#4ecdc4';
            ctx.beginPath();
            ctx.moveTo(0, -gem.size);
            ctx.lineTo(gem.size, 0);
            ctx.lineTo(0, gem.size);
            ctx.lineTo(-gem.size, 0);
            ctx.closePath();
            ctx.fill();
            
            // Inner shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.moveTo(0, -gem.size * 0.6);
            ctx.lineTo(gem.size * 0.6, 0);
            ctx.lineTo(0, gem.size * 0.6);
            ctx.lineTo(-gem.size * 0.6, 0);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        function drawDoor(door) {
            // Door frame
            ctx.fillStyle = door.activated ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(door.x, door.y, door.width, door.height);
            
            // mystical portal effect
            if (door.activated) {
                const portalGradient = ctx.createRadialGradient(
                    door.x + door.width/2, door.y + door.height/2, 0,
                    door.x + door.width/2, door.y + door.height/2, door.width
                );
                portalGradient.addColorStop(0, door.type === 'fire' ? 'rgba(255, 107, 107, 0.9)' : 'rgba(78, 205, 196, 0.9)');
                portalGradient.addColorStop(0.5, door.type === 'fire' ? 'rgba(255, 107, 107, 0.5)' : 'rgba(78, 205, 196, 0.5)');
                portalGradient.addColorStop(1, door.type === 'fire' ? 'rgba(255, 107, 107, 0.1)' : 'rgba(78, 205, 196, 0.1)');
                ctx.fillStyle = portalGradient;
                ctx.fillRect(door.x, door.y, door.width, door.height);
            }
            
            // Door frame
            ctx.strokeStyle = door.type === 'fire' ? '#ff6b6b' : '#4ecdc4';
            ctx.lineWidth = 3;
            ctx.strokeRect(door.x, door.y, door.width, door.height);
            
            // Inner frame
            ctx.strokeStyle = door.type === 'fire' ? '#ff9999' : '#7dd8d2';
            ctx.lineWidth = 1;
            ctx.strokeRect(door.x + 3, door.y + 3, door.width - 6, door.height - 6);
            
            // Chest symbol
            ctx.fillStyle = door.type === 'fire' ? '#ff6b6b' : '#4ecdc4';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('📦', door.x + door.width/2, door.y + door.height/2 + 5);
        }

        function drawLevel() {
            // Draw cave background
            drawCaveBackground();

            if (!currentLevel) return;

            // Draw platforms
            currentLevel.platforms.forEach(platform => {
                drawPlatform(platform);
            });

            // Draw hazards
            currentLevel.hazards.forEach(hazard => {
                drawHazard(hazard);
            });

            // Draw gems
            currentLevel.gems.forEach(gem => {
                drawGem(gem);
            });

            // Draw doors
            currentLevel.doors.forEach(door => {
                drawDoor(door);
            });

            // Draw particles
            gameState.particles.forEach(particle => {
                particle.draw();
            });

            // Draw players
            if (fireboy) fireboy.draw();
            if (watergirl) watergirl.draw();
        }

        function checkLevelComplete() {
            if (!currentLevel || !fireboy || !watergirl) return false;
            
            let allDoorsActivated = currentLevel.doors.every(door => door.activated);
            let allGemsCollected = currentLevel.gems.length === 0;
            
            return allDoorsActivated && allGemsCollected;
        }

        function showMessage(text) {
            const message = document.createElement('div');
            message.className = 'message';
            message.textContent = text;
            document.querySelector('.game-container').appendChild(message);
            setTimeout(() => message.remove(), 1500);
        }

        function showLevelTransition(levelNum) {
            const transition = document.createElement('div');
            transition.className = 'level-transition';
            transition.textContent = `Nivel ${levelNum}`;
            document.querySelector('.game-container').appendChild(transition);
            setTimeout(() => transition.remove(), 1500);
        }

        function gameOver() {
            gameState.isPlaying = false;
            showMessage('¡Game Over! Recarga para jugar');
        }

        function gameLoop() {
            if (!gameState.isPlaying) return;

            handleInput();
            
            if (fireboy) fireboy.update();
            if (watergirl) watergirl.update();
            
            // Update particles
            gameState.particles = gameState.particles.filter(particle => {
                particle.update();
                return particle.life > 0;
            });
            
            drawLevel();

            // Check level completion
            if (checkLevelComplete() && !gameState.transitioning) {
                gameState.transitioning = true;
                gameState.score += 500;
                document.getElementById('score').textContent = gameState.score;
                showMessage(`¡Nivel ${gameState.currentLevel} Completado!`);
                
                setTimeout(() => {
                    if (gameState.currentLevel < Object.keys(levels).length) {
                        gameState.currentLevel++;
                        showLevelTransition(gameState.currentLevel);
                        loadLevel(gameState.currentLevel);
                        gameState.transitioning = false;
                    } else {
                        showMessage('¡Juego Completado! ¡Felicidades!');
                        gameState.isPlaying = false;
                    }
                }, 1500);
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            loadLevel(1);
            gameLoop();
            
            // Start timer
            setInterval(() => {
                if (gameState.isPlaying && !gameState.transitioning) {
                    gameState.timer++;
                    let minutes = Math.floor(gameState.timer / 60);
                    let seconds = gameState.timer % 60;
                    document.getElementById('timer').textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }
    </script>
</body>
