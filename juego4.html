const GAME_CSS = `

  try { S.best = parseInt(localStorage.getItem("am_best") || "0", 10) || 0; } catch (e) { S.best = 0; }

  const keys = { left: false, right: false, up: false, down: false, run: false };

  let player = null;

  /* ---------------- Personajes seleccionables ---------------- */

    cloudS1: "https://ik.imagekit.io/rx3s8imfb/GIF%20E%20IMAGENES/nubes/nubes%20peque%C3%B1as/nube6.png?updatedAt=1792021730420",

  const assets = {};

    ASSET_URLS["dead_" + c.id] = c.dead;
  });
  function loadImage(key, url) {
    return new Promise((res) => {
      const im = new Image();
      const to = setTimeout(res, 9000);
      im.onload = () => { clearTimeout(to); assets[key] = im; res(); };
      im.onerror = () => { clearTimeout(to); res(); };
      im.src = url;
    });
  }
  async function preload() {
    const entries = Object.keys(ASSET_URLS);
    let n = 0;
    const jobs = entries.map(async (k) => {
      await loadImage(k, ASSET_URLS[k]);
      n++;
      ui.loadFill.style.width = Math.round((n / entries.length) * 100) + "%";
    });
    await Promise.race([Promise.all(jobs), new Promise((r) => setTimeout(r, 9500))]);

    p.vx = 0;
    S.lives--;
    addPenalty(PTS.death, p.x + 6, p.y - 10); // morir por mob o caer al vacío: -3
    A.sfx.die();
  }

  /* ---------------- ENEMIGOS ---------------- */
  function makeGoomba(x, startX, range) {
    return {
      kind: "goomba", x, y: GROUND_Y - T, w: T, h: T,
      vx: 0, vy: 0, dir: -1, speed: 1.1,
      startX, range, grounded: false,
      squish: 0, flipDead: false, dead: false, graceT: 0,
    };
  }
  function makeKoopa(x, startX, range) {
    return {
      kind: "koopa", x, y: GROUND_Y - T, w: T, h: T,
      vx: 0, vy: 0, dir: -1, speed: 1.4,
      startX, range, grounded: false,
      state: "walk", // walk | shell | slide
      reviveT: 0, slideDir: -1, graceT: 0,
      squish: 0, flipDead: false, dead: false,
    };
  }
  function makePiranha(pipe) {
    return {
      kind: "piranha", pipe,
      x: pipe.x + pipe.w / 2 - 14, w: 28, h: 56,
      y: pipe.y,           // empieza escondida dentro de la tubería
      vy: 0, phase: "wait", t: 80 + (pipe.x % 110),
      outH: 56, flipDead: false, dead: false, squish: 0, graceT: 0,
    };
  }
  function updatePiranha(e) {
    const top = e.pipe.y;
    const p = player;
    const near = p && p.playerMode === "normal" &&
      Math.abs((p.x + p.w / 2) - (e.x + e.w / 2)) < 120;
    if (e.phase === "wait") {
      e.t--;
      if (e.t <= 0) {
        if (near) e.t = 34;      // no muerde si el jugador está sobre la tubería
        else e.phase = "rise";
      }
    } else if (e.phase === "rise") {
      e.y -= 1.35;
      if (e.y <= top - e.outH) { e.y = top - e.outH; e.phase = "out"; e.t = 95; }
    } else if (e.phase === "out") {
      e.t--;
      if (e.t <= 0) e.phase = "sink";
    } else if (e.phase === "sink") {
      e.y += 1.35;
      if (e.y >= top) { e.y = top; e.phase = "wait"; e.t = 100 + ((e.pipe.x * 7) % 70); }
    }
  }
  function updateEnemy(e) {
    if (e.flipDead) {
      e.vy += 0.4;
      e.y += e.vy;
      e.x += e.vx;
      if (e.y > 620) e.dead = true;
      return;
    }
    if (e.kind === "goomba" && e.squish > 0) {
      e.squish--;
      if (e.squish <= 0) e.dead = true;
      return;
    }
    // congelados si quedan lejos de la cámara (a la derecha)
    if (e.x > camera.x + VW + 90) return;

    if (e.kind === "piranha") { updatePiranha(e); return; }

    if (e.kind === "koopa") {
      if (e.graceT > 0) e.graceT--;
      if (e.state === "shell") {
        e.reviveT--;
        e.vy = Math.min(e.vy + GRAV, MAX_FALL);
        moveY(e);
        if (e.y > 620) { e.dead = true; return; }
        if (e.reviveT <= 0) {
          e.state = "walk";
          e.graceT = 45;
          e.dir = Math.random() < 0.5 ? -1 : 1;
        }
        return;
      }
      if (e.state === "slide") {
        e.vx = 9.5 * e.slideDir;
        if (moveX(e)) { e.slideDir *= -1; A.sfx.bump(); }
        e.vy = Math.min(e.vy + GRAV, MAX_FALL);
        moveY(e);
        if (e.y > 620) { e.dead = true; return; }
        // el caparazón arrasa con otros enemigos
        for (const o of enemies) {
          if (o === e || o.flipDead || o.dead || o.squish > 0) continue;
          if (o.kind === "piranha" && o.pipe.y - o.y < 12) continue;
          if (aabb(e, o)) flipKill(o, PTS.kill);
        }
        return;
      }
    }

    // caminata común
    e.vx = e.speed * e.dir;
    if (moveX(e)) e.dir *= -1;
    if (e.x < e.startX - e.range || e.x > e.startX + e.range) {
      e.dir = e.x < e.startX ? 1 : -1;
      e.x = Math.max(e.startX - e.range, Math.min(e.startX + e.range, e.x));
    }
    e.vy = Math.min(e.vy + GRAV, MAX_FALL);
    moveY(e);
    if (e.y > 620) e.dead = true;
  }
  function stompBounce() {
    player.vy = keys.up ? -11.5 : -8;
    player.grounded = false;
  }
  function awardChain() {
    const pts = CHAIN_PTS[Math.min(player.chain, CHAIN_PTS.length - 1)];
    player.chain++;
    if (player.chain >= 7) {
      player.chain = 0;
      S.lives++;
      addPopup(player.x, player.y - 26, "1UP!");
      A.sfx.oneup();
    } else {
      addPopup(player.x, player.y - 26, pts);
      S.score += pts;
    }
    updateHUD();
  }
  function playerVsEnemies() {
    const p = player;
    if (p.playerMode !== "normal") return;
    for (const e of enemies) {
      if (e.flipDead || e.dead || (e.squish > 0)) continue;
      if (!aabb(p, e)) continue;

      // estrella: contacto mortal para el enemigo
      if (p.starT > 0) { flipKill(e, PTS.kill); continue; }

      // planta piraña: no se puede pisar; solo estrella, fuego o caparazón
      if (e.kind === "piranha") {
        if (e.pipe.y - e.y > 12) pDamage();   // solo si ya asomó lo suficiente
        continue;
      }

      const isIdleShell = e.kind === "koopa" && e.state === "shell";
      const isSlideShell = e.kind === "koopa" && e.state === "slide";
      const stomp = p.vy > 0 && p.y + p.h - e.y < e.h * 0.62;

      if (isIdleShell && !stomp) {
        // patada del caparazón quieto
        const dir = (p.x + p.w / 2) < (e.x + e.w / 2) ? 1 : -1;
        e.state = "slide";
        e.slideDir = dir;
        e.graceT = 12;
        A.sfx.kick(); // la patada no da puntos; matar con el caparazón da PTS.kill
        continue;
      }

      if (stomp) {
        if (e.kind === "goomba") {
          e.squish = 26;
          A.sfx.stomp();
          S.shake = 3;
        } else if (e.kind === "koopa") {
          e.state = "shell";   // pisar un caparazón deslizándolo detiene
          e.reviveT = 340;
          e.vx = 0;
          A.sfx.stomp();
        }
        awardChain();
        stompBounce();
      } else if (isSlideShell && (e.graceT || 0) <= 0) {
        pDamage();
      } else if (!isSlideShell && !isIdleShell && (e.graceT || 0) <= 0) {
        pDamage();
      }
    }
  }

  /* ---------------- ITEMS (power-ups) ---------------- */
  function makeItem(x, y, kind) {
    const speeds = { mushroom: 2.2, oneup: 3.4, star: 3.2, flower: 0 };
    return {
      kind, x, y, w: 28, h: 30,
      vx: speeds[kind] || 0, vy: 0,
      spawnY: y, emergeY: y - T, active: false,
      grounded: false, hitWall: false, dead: false,
    };
  }
  function updateItems() {
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (!it.active) {
        it.y -= 0.8;
        if (it.y <= it.emergeY) { it.y = it.emergeY; it.active = true; }
      } else if (it.kind !== "flower") {
        it.vy = Math.min(it.vy + GRAV, MAX_FALL);
        if (moveX(it)) it.vx *= -1;
        moveY(it);
        if (it.kind === "star" && it.grounded) it.vy = -8.5;
        if (it.y > 620) { items.splice(i, 1); continue; }
      }
      // recogida por el jugador
      const p = player;
      if (p.playerMode === "normal" && aabb(p, it) && (it.active || it.y < it.spawnY)) {
        if (it.kind === "mushroom") pGrow();
        else if (it.kind === "flower") {
          if (p.power === 0) { p.power = 1; p.y -= T; p.h = T * 2; }
          p.power = 2;
          A.sfx.power();
          S.score += PTS.flower;
          addPopup(it.x, it.y - 12, PTS.flower);
          updateHUD();
        } else if (it.kind === "oneup") {
          S.lives++;
          addPopup(it.x, it.y - 12, "1UP!");
          A.sfx.oneup();
          updateHUD();
        } else if (it.kind === "star") {
          p.starT = 640;
          A.sfx.power();
          S.score += PTS.star;
          addPopup(it.x, it.y - 12, PTS.star);
          updateHUD();
        }
        addParticles(it.x + 14, it.y + 14, 6, "#fff2b0", 4, 0.1);
        items.splice(i, 1);
      }
    }
  }
  function updatePickups() {
    const p = player;
    for (let i = pickups.length - 1; i >= 0; i--) {
      const c = pickups[i];
      if (p.playerMode === "normal" && aabb(p, c)) {
        pickups.splice(i, 1);
        S.coins++;
        S.score += PTS.coin;
        A.sfx.coin();
        addParticles(c.x + 11, c.y + 12, 5, "#ffd84d", 4, 0.05);
        checkCoin1up();
        updateHUD();
      }
    }
  }

  /* ---------------- CONSTRUCCIÓN DEL NIVEL ----------------
     Geometría 100% verificada: todos los segmentos de suelo son
     continuos o separados por fosos salvables (máx. 240 px) y
     todas las tuberías de warp están SOBRE suelo sólido.       */
  function buildLevel() {
    blocks = []; enemies = []; items = []; fireballs = [];
    pickups = []; particles = []; popups = []; checkpts = [];
    flagClothY = 156; flagGrabbed = false;

    const B = (x, y, type, extra) => {
      const b = { x, y, w: T, h: T, type, content: null, hit: 0, used: false, warp: null, dead: false };
      if (extra) Object.assign(b, extra);
      blocks.push(b);
      return b;
    };
    const G = (x0, n) => { for (let i = 0; i < n; i++) B(x0 + i * T, GROUND_Y, "ground"); };
    const Cl = (x0, n) => { for (let i = 0; i < n; i++) B(x0 + i * T, GROUND_Y, "cloud"); };
    const Pipe = (x, y, h, warp, plant) => {
      const b = B(x, y, "pipe", { w: 64, h, warp: warp || null });
      if (plant) enemies.push(makePiranha(b));
      return b;
    };
    const Lucky = (x, y, content) => B(x, y, "lucky", { content });
    const Brick = (x, y) => B(x, y, "brick");
    const Hard = (x, y) => B(x, y, "hard");
    const Coin = (x, y) => pickups.push({ x, y, w: 22, h: 26, phase: x * 0.05 });
    const Goo = (x, r) => enemies.push(makeGoomba(x, x, r));
    const Kop = (x, r) => enemies.push(makeKoopa(x, x, r));
    const Ck = (x) => checkpts.push({ x, clothY: 92, activated: false });
    const Stairs = (x0, n) => { for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) Hard(x0 + i * T, GROUND_Y - T - j * T); };

    /* ===== ZONA 1-1 · SUPERFICIE (0 → 12480) ===== */
    G(0, 70);                                   // 0–2240
    Lucky(320, 272, "power");
    Brick(400, 272); Brick(432, 272); Lucky(464, 272, "coin"); Brick(496, 272);
    Lucky(432, 176, "coin");
    Pipe(1400, 336, 64, null, true);            // primera piraña
    Goo(950, 250); Goo(1150, 250);
    Coin(2256, 300); Coin(2300, 286); Coin(2344, 300);   // arco sobre foso 1
    G(2400, 39);                                // 2400–3648
    Ck(2560);
    Brick(2720, 272); Brick(2752, 272); Lucky(2784, 272, "coin");
    Goo(2944, 300); Kop(3136, 280);
    for (let i = 0; i < 4; i++) for (let j = 0; j <= i; j++) Hard(3232 + i * T, GROUND_Y - T - j * T);
    Pipe(3488, 304, 96, { zone: "underground", x: 14096, y: GROUND_Y }, true); // → subsuelo
    Coin(3696, 308); Coin(3744, 290); Coin(3792, 308);   // arco sobre foso 2
    G(3840, 55);                                // 3840–5600
    Goo(4000, 250); Kop(4200, 260);
    Brick(4400, 272); Brick(4432, 272); Lucky(4464, 272, "power"); Brick(4496, 272);
    Lucky(4464, 176, "coin");
    Pipe(4800, 336, 64, null, true);            // salida decorativa del subsuelo
    Stairs(5000, 8);
    Pipe(5376, 336, 64, { zone: "sky", x: 22096, y: GROUND_Y }, true);    // → cielo
    Coin(5660, 306); Coin(5712, 288); Coin(5764, 306);   // arco sobre foso 3
    G(5824, 109);                               // 5824–9312
    Pipe(6048, 336, 64, null, true);            // salida decorativa del cielo
    Goo(6400, 250); Goo(6464, 250); Goo(6528, 250);
    Ck(6656);
    Coin(6720, 344); Coin(6752, 344); Coin(6784, 344); Coin(6816, 344);
    Kop(7000, 300);
    Brick(7200, 272); Lucky(7232, 272, "power"); Brick(7264, 272); Brick(7296, 272);
    Lucky(7264, 176, "star");                   // ★ estrella secreta
    Stairs(8300, 8);

    /* --- extensión 1-1: jardín de tuberías con pirañas --- */
    G(9312, 40);                                // 9312–10592
    Pipe(9600, 304, 96, null, true);            // tubería alta · piraña
    Kop(9860, 200);
    Pipe(10048, 336, 64, null, true);
    Goo(10260, 240);
    Coin(10640, 300); Coin(10688, 284); Coin(10736, 300);   // arco sobre foso 4
    G(10784, 53);                               // 10784–12480
    Ck(10980);                                  // checkpoint final
    Kop(11060, 160);
    Brick(11140, 272); Lucky(11172, 272, "coin"); Brick(11204, 272);
    Pipe(11360, 336, 64, null, true);
    Goo(11470, 160);
    Stairs(11560, 8);
    // bandera en 11980 · castillo en 12140 (solo dibujo)

    /* ===== ZONA 1-2 · SUBSUELO (14000 → 19760) ===== */
    for (let i = 0; i < 180; i++) B(14000 + i * T, GROUND_Y, "ground");   // piso indestructible (ampliado)
    for (let i = 11; i <= 169; i++) B(14000 + i * T, 176, "brick");       // techo rompible
    Pipe(14000, 336, 64, null, true);           // entrada decorativa · piraña

    Pipe(22000, 336, 64, null, true);           // entrada decorativa · piraña
    for (let i = 0; i < 4; i++) B(22400 + i * T, 272, "cloud");
    for (let i = 0; i < 5; i++) B(22800 + i * T, 272, "cloud");
    for (let i = 0; i < 4; i++) B(23040 + i * T, 176, "cloud");
    for (let i = 0; i < 5; i++) B(23400 + i * T, 272, "cloud");
    Coin(22416, 224); Coin(22448, 224); Coin(22480, 224);
    Coin(23056, 128); Coin(23088, 128); Coin(23120, 128);
    // pirámide doble (sube y baja)
    for (let i = 0; i < 4; i++) for (let j = 0; j <= i; j++) B(24000 + i * T, GROUND_Y - T - j * T, "cloud");
    for (let i = 0; i < 4; i++) for (let j = 0; j <= 3 - i; j++) B(24128 + i * T, GROUND_Y - T - j * T, "cloud");
    Kop(22600, 400); Kop(24500, 500); Kop(25600, 400);
    Lucky(25024, 272, "star");                  // ★ segunda estrella
    Coin(25800, 340); Coin(25832, 340); Coin(25864, 340);
    Coin(26304, 300); Coin(26336, 300); Coin(26368, 300); Coin(26400, 300);

    /* --- extensión 1-3: puentes de nubes --- */
    Cl(27248, 52);                              // piso de nubes ampliado → 28912
    for (let i = 0; i < 4; i++) B(27420 + i * T, 272, "cloud");
    for (let i = 0; i < 5; i++) B(27780 + i * T, 176, "cloud");
    Coin(27436, 224); Coin(27468, 224); Coin(27500, 224);

  /* ---------------- Cámara / entorno / HUD ---------------- */
  function clampCam(x) {
    const z = ZONES[S.zone];
    return Math.max(z.min, Math.min(z.max - VW, x));
  }
  function updateEnv() {
    frameEl.style.backgroundColor = ZONES[S.zone].bg;
    ui.world.textContent = ZONES[S.zone].code;
  }
  let hudCache = { score: "", coins: "", world: "", time: "", lives: "" };
  function updateHUD() {
    const s = S.score.toString().padStart(6, "0");
    if (s !== hudCache.score) { ui.score.textContent = s; hudCache.score = s; }
    const c = "x" + S.coins.toString().padStart(2, "0");
    if (c !== hudCache.coins) { ui.coins.textContent = c; hudCache.coins = c; }
    const w = ZONES[S.zone].code;
    if (w !== hudCache.world) { ui.world.textContent = w; hudCache.world = w; }
    const t = String(Math.max(0, S.time));
    if (t !== hudCache.time) { ui.time.textContent = t; hudCache.time = t; }
    const l = "x" + Math.max(0, S.lives);
    if (l !== hudCache.lives) { ui.lives.textContent = l; hudCache.lives = l; }
    ui.time.classList.toggle("hurry", S.hurry);
  }
  function updateBest() {
    ui.best.textContent = S.best > 0 ? "RÉCORD: " + S.best.toString().padStart(6, "0") : "";
  }
  function saveBest() {
    if (S.score > S.best) {
      S.best = S.score;
      try { localStorage.setItem("am_best", String(S.best)); } catch (e) { /* sin storage */ }
    }
    updateBest();
  }

  /* ---------------- Transición iris ---------------- */
  function irisTo(cb) {
    if (transition) return;
    transition = { phase: "close", t: 0, cb };
  }
  function updateTransition() {
    if (!transition) return;
    transition.t += 1 / 22;
    if (transition.phase === "close" && transition.t >= 1) {
      if (transition.cb) transition.cb();
      transition = { phase: "open", t: 0, cb: null };
    } else if (transition.phase === "open" && transition.t >= 1) {
      transition = null;
    }
  }

  /* ---------------- Flujo de partida ---------------- */
  function respawn() {
    buildLevel();
    S.zone = checkpoint.zone;
    player = makePlayer(checkpoint.x, checkpoint.y);
    S.time = 999;
    S.timeAcc = 0;
    S.hurry = false;
    A.tempo = 1;
    camera.x = clampCam(checkpoint.x - 320);
    updateEnv();
    updateHUD();
    A.startMusic();
  }
  function startGame() {
    unlockAudio();
    S.score = 0; S.coins = 0; S.lives = 3; S.time = 999; S.timeAcc = 0;
    S.hurry = false; S.fireQueued = false;
    S.dimDone = { underground: false, sky: false };
    A.tempo = 1;
    checkpoint = { x: 100, y: 368, zone: "main" };
    S.zone = "main";
    buildLevel();
    player = makePlayer(100, 368);
    camera.x = 0;
    updateEnv();
    updateHUD();
    setMode("PLAYING");
    A.startMusic();
  }
  function gameOverNow() {
    addPenalty(PTS.gameOver); // quedarte sin vidas: -5 del score conseguido
    saveBest();
    setMode("GAMEOVER");
    ui.overStats.innerHTML =
      "PUNTOS: " + S.score.toString().padStart(6, "0") + "<br>RÉCORD: " + S.best.toString().padStart(6, "0");
  }
  function enterWin() {
    saveBest();
    setMode("WIN");
    ui.winStats.innerHTML =
      "PUNTOS: " + S.score.toString().padStart(6, "0") +
      "<br>MONEDAS: " + S.coins +
      "<br>RÉCORD: " + S.best.toString().padStart(6, "0");

  }
  function toTitle() {
    S.zone = "main";
    buildLevel();
    player = makePlayer(100, 368);
    player.playerMode = "hidden";
    camera.x = 300;
    updateEnv();
    setMode("TITLE");
    updateBest();

  function setMode(m) {
    S.mode = m;
    ui.loading.classList.toggle("hidden", m !== "LOADING");
    ui.title.classList.toggle("hidden", m !== "TITLE");
    ui.pauseL.classList.toggle("hidden", m !== "PAUSED");
    ui.over.classList.toggle("hidden", m !== "GAMEOVER");
    ui.win.classList.toggle("hidden", m !== "WIN");
    if (m !== "PLAYING") A.stopMusic();
  }
  function togglePause() {
    if (S.mode === "PLAYING") { setMode("PAUSED"); A.stopMusic(); }
    else if (S.mode === "PAUSED") { setMode("PLAYING"); A.startMusic(); }
  }

  /* ---------------- ACTUALIZACIÓN PRINCIPAL ---------------- */
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      if (pt.kind === "coinpop") {
        pt.y += pt.vy; pt.vy += 0.35; pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
        continue;
      }
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.grav; pt.life--;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }
  function updatePopups() {
    for (let i = popups.length - 1; i >= 0; i--) {
      const q = popups[i];
      q.y -= 1.1; q.life--;
      if (q.life <= 0) popups.splice(i, 1);

        ctx.fillStyle = "#2a8a2a";
        ctx.beginPath(); ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1a5a1a";
        ctx.beginPath(); ctx.ellipse(0, 0, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    } else {
      // sprites direccionales del usuario (izquierda/derecha), sprite alto estilo clásico
      const imL = img("koopaL"), imR = img("koopaR");
      let imK, flip = false, tall = false;
      if (imL || imR) {
        imK = e.dir > 0 ? (imR || imL) : (imL || imR);
        flip = e.dir > 0 ? !imR : !imL;   // espejo solo si falta el del lado
        tall = true;
      } else {
        imK = img("koopa");
        flip = e.dir > 0;                 // el respaldo mira a la izquierda
      }
      if (imK) {
        ctx.translate(cx, cy);
        if (flip) ctx.scale(-1, 1);
        if (tall) ctx.drawImage(imK, -14, 16 - 46, 28, 46);
        else ctx.drawImage(imK, -16, -16, 32, 32);
      } else {
        ctx.fillStyle = "#2a8a2a";
        ctx.beginPath(); ctx.arc(cx, cy + 4, 13, Math.PI, 0); ctx.fill();
        ctx.fillRect(cx - 13, cy + 4, 26, 12);
        ctx.fillStyle = "#ffd84d";
        ctx.fillRect(cx - 15, cy + 12, 30, 4);
      }
    }
    ctx.restore();
  }
  function drawFireball(f) {
    ctx.save();
    ctx.translate(f.x + 6, f.y + 6);
    ctx.rotate(f.rot);
    ctx.fillStyle = "#ff5a1a";
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd84d";
    ctx.beginPath(); ctx.arc(2, 0, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawPlayer() {
    const p = player;
    if (!p || p.playerMode === "hidden") return;
    if (p.invuln > 0 && p.playerMode === "normal" && (S.frame >> 2) % 2 === 0) return;
    const im = p.playerMode === "dead" ? img("dead_" + selChar.id) : p.power >= 1 ? img("big_" + selChar.id) : img("small_" + selChar.id);
    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(Math.round(p.x) + p.w / 2, Math.round(p.y) + p.h);
    if (p.facing < 0) ctx.scale(-1, 1);
    if (p.playerMode !== "dead") {
      let sy = 1, sx = 1;
      if (!p.grounded && p.playerMode === "normal") { sy = 1.05; sx = 0.95; }
      else if (Math.abs(p.vx) > 0.5) sy = 1 + Math.sin(S.frame * 0.35) * 0.02;
      ctx.scale(sx, sy);
    }
    if (p.starT > 0) ctx.filter = "hue-rotate(" + ((S.frame * 29) % 360) + "deg) saturate(1.7) brightness(1.15)";
    else if (p.power === 2) ctx.filter = "saturate(0.3) brightness(1.4)";
    if (im) ctx.drawImage(im, -p.w / 2, -p.h, p.w, p.h);
    else {
      ctx.fillStyle = selChar.id === "luigi" ? "#2ea44f" : "#e52521"; ctx.fillRect(-p.w / 2, -p.h, p.w, p.h * 0.55);
      ctx.fillStyle = "#2b5fd9"; ctx.fillRect(-p.w / 2, -p.h + p.h * 0.5, p.w, p.h * 0.5);
    }
    ctx.restore();
  }
  function drawParticle(pt) {
    if (pt.kind === "coinpop") {
      const sc = Math.cos((pt.max - pt.life) * 0.35);
      ctx.save();
      ctx.translate(pt.x + 11, pt.y + 13);
      ctx.scale(Math.abs(sc) < 0.2 ? 0.2 : sc, 1);
      ctx.fillStyle = "#ffd84d";
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      return;
    }
    ctx.globalAlpha = Math.max(0, Math.min(1, pt.life / pt.max));
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
    ctx.globalAlpha = 1;
  }
  function drawPopup(q) {
    ctx.font = '10px "Press Start 2P",monospace';
    ctx.textAlign = "center";
    ctx.globalAlpha = Math.min(1, q.life / 20);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.neg ? "#ff6b6b" : "#fff";
    ctx.fillText(q.text, q.x, q.y);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }
  function drawIris() {
    if (!transition) return;
    const t = transition.phase === "close" ? 1 - transition.t : transition.t;
    const r = Math.max(0, t * 580);
    const px = player ? player.x - camera.x + player.w / 2 : VW / 2;
    const py = player ? player.y + player.h / 2 : VH / 2;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.arc(px, py, r, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
  }
  function draw() {
    ctx.fillStyle = ZONES[S.zone].bg;
    ctx.fillRect(0, 0, VW, VH);
    drawParallax();
    ctx.save();
    let shx = 0, shy = 0;
    if (S.shake > 0) { shx = (Math.random() - 0.5) * 4; shy = (Math.random() - 0.5) * 3; }
    ctx.translate(-Math.round(camera.x) + shx, shy);
    checkpts.forEach(drawCheckpoint);
    drawFlagAndCastle();
    enemies.forEach((e) => { if (e.kind === "piranha") drawPiranha(e); }); // detrás de las tuberías
    blocks.forEach(drawBlock);
    pickups.forEach(drawPickup);
    items.forEach(drawItem);
    enemies.forEach(drawEnemy);
    fireballs.forEach(drawFireball);
    drawPlayer();
    particles.forEach(drawParticle);
    popups.forEach(drawPopup);
    ctx.restore();
    drawIris();
  }

  /* ---------------- Bucle con timestep fijo (60 Hz) ----------------
     Corrige el bug original: el juego iba 2x más rápido en
     monitores de 120/144 Hz porque usaba requestAnimationFrame
     sin control de tiempo.                                        */
  let rafId = 0;
  let last = performance.now();
  let acc = 0;
  const STEP = 1000 / 60;
  function loop(now) {
    rafId = requestAnimationFrame(loop);
    acc += Math.min(now - last, 120);
    last = now;
    let n = 0;
    while (acc >= STEP && n < 4) { tick(); acc -= STEP; n++; }
    if (n === 4) acc = 0;
    draw();
  }

  /* ---------------- Entrada: teclado ---------------- */
  const GAME_KEYS = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space",
    "KeyA", "KeyD", "KeyW", "KeyS", "ShiftLeft", "ShiftRight", "KeyX", "KeyK"];
  function onKeyDown(e) {
    if (GAME_KEYS.indexOf(e.code) >= 0) e.preventDefault();
    unlockAudio();
    switch (e.code) {
      case "ArrowRight": case "KeyD":
        if (S.mode === "TITLE") { if (!e.repeat) setCharacter(charIdx + 1); break; }
        keys.right = true; break;
      case "ArrowLeft": case "KeyA":
        if (S.mode === "TITLE") { if (!e.repeat) setCharacter(charIdx - 1); break; }
        keys.left = true; break;
      case "ArrowUp": case "Space": case "KeyW":
        if (!e.repeat && player) player.buffer = BUFFER;
        keys.up = true;
        break;
      case "ArrowDown": case "KeyS": keys.down = true; break;
      case "ShiftLeft": case "ShiftRight": keys.run = true; break;
      case "KeyX": case "KeyK": if (!e.repeat) S.fireQueued = true; break;
      case "KeyP": case "Escape": if (!e.repeat) togglePause(); break;
      case "KeyM": if (!e.repeat) toggleSnd(); break;
      case "Enter": if (!e.repeat && S.mode === "TITLE") startGame(); break;
    }
  }
  function onKeyUp(e) {
    switch (e.code) {
      case "ArrowRight": case "KeyD": keys.right = false; break;
      case "ArrowLeft": case "KeyA": keys.left = false; break;
      case "ArrowUp": case "Space": case "KeyW": keys.up = false; break;
      case "ArrowDown": case "KeyS": keys.down = false; break;
      case "ShiftLeft": case "ShiftRight": keys.run = false; break;
    }
  }
  function onVis() { if (document.hidden && S.mode === "PLAYING") togglePause(); }
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);
  document.addEventListener("visibilitychange", onVis);

  /* ---------------- Entrada: táctil / botones ---------------- */
  function toggleSnd() {
    const m = A.toggleMute();
    ui.snd.textContent = m ? "OFF" : "SND";
    ui.snd.classList.toggle("off", m);
  }
  function bindTouch(el, onDown, onUp) {
    const d = (e) => { e.preventDefault(); unlockAudio(); if (onDown) onDown(); };
    const u = (e) => { e.preventDefault(); if (onUp) onUp(); };
    el.addEventListener("touchstart", d, { passive: false });
    el.addEventListener("touchend", u, { passive: false });
    el.addEventListener("touchcancel", u, { passive: false });
    el.addEventListener("mousedown", d);
    el.addEventListener("mouseup", u);
    el.addEventListener("mouseleave", u);
  }
  bindTouch($("amBtL"), () => { keys.left = true; }, () => { keys.left = false; });
  bindTouch($("amBtR"), () => { keys.right = true; }, () => { keys.right = false; });
  bindTouch($("amBtD"), () => { keys.down = true; }, () => { keys.down = false; });
  bindTouch($("amBtA"),
    () => { keys.up = true; if (player) player.buffer = BUFFER; },
    () => { keys.up = false; });
  let bDownT = 0;
  bindTouch($("amBtB"),
    () => { keys.run = true; bDownT = Date.now(); },
    () => { keys.run = false; if (Date.now() - bDownT < 220) S.fireQueued = true; });

  $("amPrev").addEventListener("click", () => { unlockAudio(); setCharacter(charIdx - 1); });
  $("amNext").addEventListener("click", () => { unlockAudio(); setCharacter(charIdx + 1); });
  $("amStart").addEventListener("click", startGame);
  $("amRetry").addEventListener("click", startGame);
  $("amAgain").addEventListener("click", startGame);
  $("amRestart").addEventListener("click", startGame);
  $("amResume").addEventListener("click", togglePause);
  $("amMenu").addEventListener("click", toTitle);
  $("amMenu2").addEventListener("click", toTitle);
  $("amPauseBtn").addEventListener("click", togglePause);
  ui.snd.addEventListener("click", toggleSnd);

  /* ---------------- Arranque ---------------- */
  buildLevel();
  player = makePlayer(100, 368);
  player.playerMode = "hidden";
  camera.x = 300;
  updateEnv();
  updateHUD();
  updateBest();
  preload().then(() => { if (S.mode === "LOADING") setMode("TITLE"); });
  rafId = requestAnimationFrame(loop);

  // Hook de depuración (solo lectura) para pruebas automatizadas
  window.__AM = {
    get state() {
      return {
        mode: S.mode, zone: S.zone, frame: S.frame,
        px: player ? Math.round(player.x) : -1,
        py: player ? Math.round(player.y) : -1,
        ph: player ? player.h : 0,
        g: player ? !!player.grounded : false,
        pm: player ? player.playerMode : "",
        power: player ? player.power : -1,
        starT: player ? player.starT : 0,
        cam: Math.round(camera.x),
        enemies: enemies.length,
        enemySample: enemies.slice(0, 4).map((e) => ({ k: e.kind, x: Math.round(e.x), y: Math.round(e.y) })),
        plants: enemies.filter((e) => e.kind === "piranha").map((e) => ({ x: Math.round(e.x), y: Math.round(e.y) })),
        items: items.map((i) => i.kind),
        cps: checkpts.map((c) => ({ x: c.x, on: c.activated })),
        blocks: blocks.length, lives: S.lives, score: S.score, coins: S.coins,
      };
    },
  };
  // Teleport de pruebas — SOLO disponible con #debug en la URL
  if (location.hash === "#debug") {
    window.__AM.warp = (x, zone, y) => {
      if (!player) return "no player";
      if (zone) S.zone = zone;
      player.x = x;
      player.y = (typeof y === "number") ? y : GROUND_Y - player.h;
      player.vx = 0; player.vy = 0;
      player.invuln = 0;
      player.playerMode = "normal";
      camera.x = clampCam(x - 320);
      updateEnv();
      return "warped to " + x;
    };
    window.__AM.give = (kind) => {
      if (!player) return "no player";
      if (kind === "flower") { if (player.power === 0) { player.y -= T; player.h = T * 2; } player.power = 2; updateHUD(); return "fire"; }
      if (kind === "star") { player.starT = 640; return "star"; }
      return "?";
    };
  }

  /* ---------------- Limpieza (para React) ---------------- */
  return function cleanup() {
    cancelAnimationFrame(rafId);
    window.removeEventListener("resize", onResize);
    window.removeEventListener("keydown", onKeyDown);
    window.removeEventListener("keyup", onKeyUp);
    document.removeEventListener("visibilitychange", onVis);
    clearInterval(A.mTimer);
    A.stopMusic();
    if (A.ac) { try { A.ac.close(); } catch (e) { /* noop */ } }
    styleEl.remove();
    root.innerHTML = "";
  };
}


mountAdventurousMario(document.getElementById('am-root'));
</script>
<script>
/* ============ CONECTOR DE SCORE CON LA PÁGINA PRINCIPAL ============ */
(function () {
  var GAME_TITLE = "Adventurous Mario"; // Debe coincidir EXACTO con index.html
  var lastSent = -1;   // último score ya reportado
  var bestSeen = 0;    // puntaje máximo visto en esta sesión

  function inIframe() { try { return window.self !== window.top; } catch (e) { return true; } }

  function report() {
    if (!inIframe() || bestSeen <= 0 || bestSeen === lastSent) return;
    lastSent = bestSeen;
    try {
      window.parent.postMessage({ type: "gameScore", game: GAME_TITLE, score: bestSeen }, "*");
    } catch (e) {}
  }

  function watchScore() {
    var el = document.getElementById("amScore");
    if (!el) { setTimeout(watchScore, 400); return; }
    var read = function () {
      var v = parseInt((el.textContent || "").replace(/[^0-9]/g, ""), 10);
      if (!isNaN(v) && v > bestSeen) bestSeen = v;
    };
    read();
    if (window.MutationObserver) {
      new MutationObserver(read).observe(el, { childList: true, characterData: true, subtree: true });
    }
    setInterval(function () { read(); report(); }, 10000); // respaldo cada 10s
  }

  window.addEventListener("pagehide", report);
  window.addEventListener("beforeunload", report);
  document.addEventListener("visibilitychange", function () { if (document.hidden) report(); });

  watchScore();
})();
</script>
